name: Temporary Spain Source Health Audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        source:
          - linkedin
          - ikerbasque
          - atswatch
          - santpau
          - fbg
          - biocat
          - gencat
          - csic
          - isciii
          - idibaps
          - upc
          - idibell
          - hospitaldelmar
          - bist
          - institutions
          - madrid
          - fisabio
          - fps
          - iislafe
    env:
      PYTHONUNBUFFERED: "1"
      AI_JOB_SEARCH_MADS_REPO: ${{ github.workspace }}/external/ai-job-search
      MADS_REPO: ${{ vars.MADS_REPO }}
      EXTERNAL_REPO_TOKEN: ${{ secrets.EXTERNAL_REPO_TOKEN }}
      MADRID_RELAY_URL: ${{ vars.MADRID_RELAY_URL }}
      MADRID_RELAY_TOKEN: ${{ secrets.MADRID_RELAY_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Bun
        if: ${{ matrix.source == 'linkedin' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-cloud.txt
      - name: Clone LinkedIn transport
        if: ${{ matrix.source == 'linkedin' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          REPO="${MADS_REPO:-MadsLorentzen/ai-job-search}"
          if [ -n "${EXTERNAL_REPO_TOKEN:-}" ]; then
            git clone --depth 1 "https://x-access-token:${EXTERNAL_REPO_TOKEN}@github.com/${REPO}.git" "$AI_JOB_SEARCH_MADS_REPO"
          else
            git clone --depth 1 "https://github.com/${REPO}.git" "$AI_JOB_SEARCH_MADS_REPO"
          fi
          if [ -f "$AI_JOB_SEARCH_MADS_REPO/package.json" ]; then
            (cd "$AI_JOB_SEARCH_MADS_REPO" && (bun install --frozen-lockfile || bun install))
          fi
      - name: Verify scoring freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          from jobbot.production import assert_scoring_freeze
          print(assert_scoring_freeze(Path('.').resolve()))
          PY
      - name: Live no-state source audit
        shell: bash
        run: |
          set -o pipefail
          SOURCE="${{ matrix.source }}"
          mkdir -p "runtime/diagnostic/${SOURCE}"
          START=$(date +%s)
          set +e
          python run_live_sample.py --source "$SOURCE" --no-state --linkedin-repo "$AI_JOB_SEARCH_MADS_REPO" --out "runtime/diagnostic/${SOURCE}" 2>&1 | tee "runtime/${SOURCE}_diagnostic_stdout.log"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          END=$(date +%s)
          echo "AUDIT_SOURCE=$SOURCE AUDIT_EXIT=$EXIT_CODE AUDIT_ELAPSED=$((END-START))"
          if [ -f "runtime/diagnostic/${SOURCE}/run_summary.json" ]; then
            echo "===RUN_SUMMARY==="
            cat "runtime/diagnostic/${SOURCE}/run_summary.json"
          fi
          if [ -f "runtime/diagnostic/${SOURCE}/source_summary.csv" ]; then
            echo "===SOURCE_SUMMARY==="
            cat "runtime/diagnostic/${SOURCE}/source_summary.csv"
          fi
          exit "$EXIT_CODE"
