name: EURAXESS Branch-only Live Diagnostic
on:
  push:
    branches:
      - experiment/euraxess-coverage-detail-cache-20261019
    paths:
      - .github/workflows/euraxess-live-diagnostic-20261019.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Read-only live EURAXESS diagnostic (no R2 access, no production state)
        run: |
          python - <<'PY'
          import json
          from sources.euraxess import collect, _DETAIL_CACHE, _FEED_CACHE
          from pathlib import Path
          diagnostics = {}
          rows = collect(diagnostics=diagnostics, enrich_detail=True)
          print("LIVE_AUDIT="+json.dumps({
              "jobs":len(rows),
              "feed": diagnostics.get("feed"),
              "detail_attempts":diagnostics.get("detail_attempts"),
              "detail_success":diagnostics.get("detail_success"),
              "detail_failed":diagnostics.get("detail_failed"),
              "detail_network_requests":diagnostics.get("detail_network_requests"),
              "detail_persistent_cache_hits":diagnostics.get("detail_persistent_cache_hits"),
              "detail_rate_limited":diagnostics.get("detail_rate_limited"),
          }, default=str))
          import sources.euraxess as e
          e._DETAIL_CACHE.clear()
          second = {}
          again = collect(diagnostics=second, enrich_detail=True)
          print("REPLAY_AUDIT="+json.dumps({
              "jobs":len(again),
              "feed_cache_hit":second.get("feed_cache_hit"),
              "detail_attempts":second.get("detail_attempts"),
              "detail_success":second.get("detail_success"),
              "detail_failed":second.get("detail_failed"),
              "detail_network_requests":second.get("detail_network_requests"),
              "detail_persistent_cache_hits":second.get("detail_persistent_cache_hits"),
          }, default=str))
          assert len(again) == len(rows)
          assert second.get("detail_network_requests",0) == 0 or second.get("detail_persistent_cache_hits",0) > 0, "No cache reuse on replay"
          PY
