name: Temporary EURAXESS Spain repair v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'EURAXESS Spain resilient transport') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-cloud.txt
      - name: Rebuild candidate from validated v1 recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/tmp-euraxess-spain-repair.yml').read_text(encoding='utf-8')

          def heredoc(marker, next_marker):
              start = wf.index(marker) + len(marker)
              end = wf.index(next_marker, start)
              return textwrap.dedent(wf[start:end]).lstrip('\n')

          patch_script = heredoc("cat > /tmp/patch_euraxess.py <<'PY'", "\n          PY\n\n          cat > sources/euraxess_transport.py")
          helper = heredoc("cat > sources/euraxess_transport.py <<'PY'", "\n          PY\n\n          python /tmp/patch_euraxess.py")
          tests = heredoc("cat > tests/test_v203_euraxess_resilient_transport.py <<'PY'", "\n          PY\n\n      - name: Focused regressions")

          # Compatibility for old synthetic sessions while production still uses POST.
          helper = helper.replace(
              "call = session.post if method.upper() == 'POST' else session.get",
              "call = getattr(session, 'post', session.get) if method.upper() == 'POST' else session.get",
          )
          helper = helper.replace("_next_listing_url(response.text, response.url)", "_next_listing_url(response.text, getattr(response, 'url', current_url))")
          helper = helper.replace("_next_listing_url(retry.text, retry.url)", "_next_listing_url(retry.text, getattr(retry, 'url', current_url))")
          helper = helper.replace("_increment_page(response.url)", "_increment_page(getattr(response, 'url', current_url))")

          Path('/tmp/patch_euraxess.py').write_text(patch_script, encoding='utf-8')
          Path('sources/euraxess_transport.py').write_text(helper, encoding='utf-8')
          Path('tests/test_v203_euraxess_resilient_transport.py').write_text(tests, encoding='utf-8')

          # The old V1.93 regression synthesized ?page=N without a real Next link.
          # The repaired collector follows the portal's actual Next contract, so keep
          # the regression meaningful by advertising a next page while returning the
          # same content repeatedly.
          old = Path('tests/test_v186_euraxess_recall_health.py')
          t = old.read_text(encoding='utf-8')
          needle = 'JOB Spain Example University Posted on: 20 September 2026 Work Locations: Spain</div>\n    """'
          repl = 'JOB Spain Example University Posted on: 20 September 2026 Work Locations: Spain</div>\n    <a rel="next" href="/jobs/search?page=1">Next</a>\n    """'
          if needle not in t:
              raise SystemExit('old EURAXESS repeat regression anchor missing')
          old.write_text(t.replace(needle, repl, 1), encoding='utf-8')
          PY
          python /tmp/patch_euraxess.py
      - name: Focused regressions and scoring freeze
        run: |
          python -m pytest -q tests/test_v186_euraxess_recall_health.py tests/test_v203_euraxess_resilient_transport.py
          python - <<'PY'
          from pathlib import Path
          from jobbot.production import assert_scoring_freeze
          print(assert_scoring_freeze(Path('.').resolve()))
          PY
      - name: Live listing validation
        run: |
          python - <<'PY'
          from sources import euraxess
          euraxess._FEED_CACHE.clear()
          cards, diag, cache = euraxess._get_spain_feed(pages=8, timeout=(10,45))
          print('LIVE_EURAXESS_CARDS=', len(cards))
          print('LIVE_EURAXESS_DIAG=', diag)
          assert len(cards) > 0, diag
          assert diag.get('coverage_complete') is True, diag
          assert not diag.get('pagination_repeat_detected'), diag
          PY
      - name: Live bounded detail validation
        run: |
          python - <<'PY'
          from sources import euraxess
          euraxess._FEED_CACHE.clear()
          diagnostics = {}
          rows = euraxess.collect(enrich_detail=True, pages=8, max_candidates=5, detail_request_delay=3.0, diagnostics=diagnostics)
          print('LIVE_DETAIL_ROWS=', len(rows))
          print('LIVE_DETAIL_DIAG=', diagnostics)
          assert rows, diagnostics
          assert diagnostics.get('detail_rate_limited') is False, diagnostics
          PY
      - name: Commit validated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/euraxess.py sources/euraxess_transport.py tests/test_v186_euraxess_recall_health.py tests/test_v203_euraxess_resilient_transport.py
          git diff --cached --stat
          git commit -m "EURAXESS Spain resilient transport" || exit 0
          git push origin main
