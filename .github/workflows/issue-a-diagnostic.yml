name: Issue A evaluator precision diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-a-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      CANONICAL_KEY: runs/2026-10-04/37173668452-1/all_canonical.csv.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-cloud.txt
      - name: Download immutable Oct 4 canonical snapshot
        run: |
          python - <<'PY'
          import os, boto3
          endpoint = os.environ.get("R2_ENDPOINT") or f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com"
          s3 = boto3.client(
              "s3", endpoint_url=endpoint,
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )
          s3.download_file(os.environ["R2_BUCKET"], os.environ["CANONICAL_KEY"], "/tmp/all_canonical.csv.gz")
          PY
      - name: Trace target rows and V1.40 promotion signals
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import csv, gzip, json, re
          from jobbot.evaluate import evaluate_job, detect_domain, detect_family
          from jobbot.normalize import clean_text, normalize

          targets = ("evonik", "iglubit")
          with gzip.open("/tmp/all_canonical.csv.gz", "rt", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          found = []
          for row in rows:
              hay = " ".join([row.get("title", ""), row.get("company", ""), row.get("employer", "")]).lower()
              if any(x in hay for x in targets):
                  found.append(row)

          print("TARGET_ROWS", len(found))
          for row in found:
              title = clean_text(row.get("title"))
              jd = clean_text(row.get("full_detail") or row.get("description"))
              norm = normalize(f"{title}\n{jd}")
              domain, domain_hits, distant_hits = detect_domain(norm)
              initial_family, family_patterns = detect_family(title)
              research_context = bool(re.search(
                  r"\bresearch\b|\bscientific\b|\bclinical\b|\bhorizon europe\b|\binternational consortium\b|\beu project",
                  norm, re.I
              ))
              signal_patterns = [
                  ("institution", r"research institute|research centre|research center|centro de investigacion|centre de recerca|instituto de investigacion|universit|research foundation|fundacion.{0,80}investigacion|fundacio.{0,80}recerca|hospital.{0,80}research|directorate of research|research and innovation|research teams?|equips? d investigacio|grups? d investigacio|equipos? de investigacion"),
                  ("management", r"gestion.{0,100}(?:proyectos?|projectes?|investigacion|recerca)|gestio.{0,100}(?:projectes?|recerca)|coordinacion.{0,100}(?:proyectos?|procesos?|cientific|tecnic)|coordinacio.{0,100}(?:projectes?|processos?|cientific|tecnic)|project (?:management|planning|coordination|monitoring)|planning.{0,80}(?:project|workplan)|monitoring.{0,80}(?:project|activities)"),
                  ("grants", r"convocatorias?.{0,100}(?:ayudas?|competitivas?|internas?|financiacion)|convocatories?.{0,100}(?:ajuts?|competitives?|internes?|financament)|grant calls?|research grants?|funding calls?|funding opportunit|oportunidades? de financiacion|oportunitats? de financament|pre[- ]?award|proposal preparation|preparacion.{0,80}propuestas?|elaboracio.{0,80}propostes?|competitive proposals?"),
                  ("accreditation", r"acreditacion(?:es)? institucional|acreditacions? institucionals?|hrs4r|\bcerca\b|\bisciii\b"),
                  ("reporting_delivery", r"informes?|memorias?|reports?|reporting|presentaciones?|presentacions?|deliverables?|milestones?|workplans?|work packages?|risk management"),
                  ("scientific_technical_coordination", r"comision.{0,80}(?:proyectos?|priorizacion)|comissio.{0,80}(?:projectes?|prioritzacio)|scientific coordination|coordinacion cientifica|coordinacio cientifica|technical coordination|coordinacion tecnica|coordinacio tecnica"),
                  ("eu_consortium", r"horizon europe|european commission|erc\b|\bmsca\b|eu4health|international consortium|consorcios? internacionales?|consorcis? internacionals?"),
              ]
              signal_hits = {}
              snippets = {}
              for name, pat in signal_patterns:
                  m = re.search(pat, norm, re.I)
                  signal_hits[name] = bool(m)
                  if m:
                      snippets[name] = norm[max(0, m.start()-80):min(len(norm), m.end()+120)]

              result = evaluate_job(row)
              print("=== TARGET ===")
              print(json.dumps({
                  "title": title,
                  "company": row.get("company") or row.get("employer"),
                  "source": row.get("source"),
                  "url": row.get("url") or row.get("job_url"),
                  "initial_family": initial_family,
                  "family_patterns": family_patterns,
                  "domain_before_pm_inference": domain,
                  "domain_hits": domain_hits,
                  "distant_hits": distant_hits,
                  "generic_research_context": research_context,
                  "institutional_signal_hits": signal_hits,
                  "institutional_signal_count": sum(signal_hits.values()),
                  "signal_snippets": snippets,
                  "evaluation": {k: result.get(k) for k in ["score","recommendation","job_family","domain_category","fit_signals","partial_matches","missing_requirements","blockers"]},
                  "jd_excerpt": jd[:3500],
              }, ensure_ascii=False, indent=2))

          assert len(found) >= 2, f"Expected both audit targets, found {len(found)}"
          PY