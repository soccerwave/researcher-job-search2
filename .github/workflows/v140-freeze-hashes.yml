name: V1.40 Freeze Hashes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v140-freeze-hashes.yml"

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print scoring hashes
        run: |
          sha256sum             jobbot/evaluate.py             jobbot/rules.py             jobbot/normalize.py             config/rules.json             config/profile.json             jobbot/availability.py
