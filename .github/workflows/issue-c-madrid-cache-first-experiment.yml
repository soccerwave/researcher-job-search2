name: Issue C Madrid Cache First Experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-c-madrid-cache-first-experiment.yml"

permissions:
  contents: read

concurrency:
  group: issue-c-madrid-experiment
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      MADRID_RELAY_URL: ${{ vars.MADRID_RELAY_URL }}
      MADRID_RELAY_TOKEN: ${{ secrets.MADRID_RELAY_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-cloud.txt
      - name: Apply cache-first experiment locally
        run: |
          cat >> /tmp/patch.py <<'PY'
          from pathlib import Path
          p=Path('sources/madrid_idi_history.py')
          s=p.read_text(encoding='utf-8')
          old='''def collect(*args, diagnostics: dict | None = None, **kwargs) -> list[dict]:\n    diag = diagnostics if diagnostics is not None else {}\n    rows = base.collect(*args, diagnostics=diag, **kwargs)\n    _apply_historical_fallback(rows, diag)\n    return rows\n'''
          new='''def _prefill_recent_history(rows: list[dict], diagnostics: dict) -> tuple[list[dict], list[dict]]:\n    \"\"\"Use a verified recent Full JD before hitting the fragile POEM relay.\n\n    Only an exact stable identity + normalized title/company match is eligible, and the\n    existing two-day effective-age policy still applies. Cache hits are explicitly\n    labelled CACHE; they are never represented as fresh network resolutions.\n    \"\"\"\n    path = _download_latest_canonical()\n    cache, cache_diag = _load_cache(path)\n    diagnostics.update(cache_diag)\n    diagnostics[\"historical_prefill_attempted\"] = len(rows)\n    diagnostics[\"historical_prefill_used\"] = 0\n    diagnostics[\"historical_prefill_rejected\"] = 0\n    misses: list[dict] = []\n    hits: list[dict] = []\n    for row in rows:\n        previous = _match_current_to_history(row, cache) if cache else None\n        previous_detail = str((previous or {}).get(\"full_detail\") or \"\").strip()\n        if not previous or not previous_detail:\n            diagnostics[\"historical_prefill_rejected\"] += 1\n            misses.append(row)\n            continue\n        resolved_url = (\n            _clean(previous.get(\"detail_resolved_url\"))\n            or _clean(previous.get(\"trusted_full_detail_url\"))\n            or _clean(previous.get(\"url\"))\n        )\n        row[\"full_detail\"] = previous_detail\n        row[\"detail_status\"] = \"CACHE\"\n        row[\"detail_fetch_status\"] = \"CACHE_PREFILL\"\n        row[\"detail_source\"] = \"historical_prefill\"\n        row[\"detail_resolution_method\"] = \"historical_prefill\"\n        row[\"detail_age_days\"] = int(previous.get(\"_detail_age_days\") or 0)\n        row[\"trusted_full_detail_source\"] = \"Madrid I+D+i historical prefill\"\n        if resolved_url:\n            row[\"detail_resolved_url\"] = resolved_url\n            row[\"trusted_full_detail_url\"] = resolved_url\n        diagnostics[\"historical_prefill_used\"] += 1\n        hits.append(row)\n    return hits, misses\n\n\ndef collect(*args, diagnostics: dict | None = None, **kwargs) -> list[dict]:\n    diag = diagnostics if diagnostics is not None else {}\n    enrich_detail = bool(kwargs.pop(\"enrich_detail\", True))\n    if not enrich_detail:\n        return base.collect(*args, diagnostics=diag, enrich_detail=False, **kwargs)\n\n    rows = base.collect(*args, diagnostics=diag, enrich_detail=False, **kwargs)\n    hits, misses = _prefill_recent_history(rows, diag)\n\n    cache_count = len(hits)\n    diag[\"detail_success\"] = cache_count\n    diag[\"detail_failed\"] = 0\n    diag[\"detail_attempts\"] = 0\n    diag[\"detail_status_counts\"] = {\"CACHE\": cache_count} if cache_count else {}\n    diag[\"fresh_detail_attempts\"] = len(misses)\n\n    if misses:\n        workers = int(kwargs.get(\"detail_workers\", 1) or 1)\n        base._enrich_detail_rows(misses, diag, timeout=(10, 45), detail_workers=workers)\n        counts = dict(diag.get(\"detail_status_counts\") or {})\n        counts[\"CACHE\"] = int(counts.get(\"CACHE\", 0) or 0) + cache_count\n        diag[\"detail_status_counts\"] = counts\n        diag[\"detail_success\"] = int(diag.get(\"detail_success\", 0) or 0) + cache_count\n\n    # Keep the old fallback as a safety net for any fresh miss that had no eligible\n    # prefill at the beginning of this same run. It uses exactly the same strict cache\n    # matcher and effective-age rules.\n    _apply_historical_fallback(rows, diag)\n    return rows\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python /tmp/patch.py
      - name: Focused cache-age and relay regressions
        env:
          MADRID_RELAY_URL: ""
          MADRID_RELAY_TOKEN: ""
        run: |
          pytest -q \
            tests/test_v172_madrid_relay_backpressure.py \
            tests/test_v173_madrid_deferred_relay_recovery.py \
            tests/test_v201_madrid_cache_age.py \
            -k "not manifest"
      - name: Run production-shaped cache-first experiment
        run: |
          test -n "${MADRID_RELAY_URL:-}"
          test -n "${MADRID_RELAY_TOKEN:-}"
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health" >/dev/null
          mkdir -p runtime/c
          START=$(date +%s)
          python run_live_sample.py --source madrid --no-state --out runtime/c | tee runtime/c/stdout.log
          END=$(date +%s)
          echo "ISSUE_C_CACHE_FIRST_ELAPSED_SECONDS=$((END-START))"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runtime/c/run_summary.json').read_text())
          m=d['source_diagnostics']['madrid']
          keys=['pages_fetched','parsed_cards','unique_cards','card_count_mismatches','detail_attempts',
                'fresh_detail_attempts','detail_success','detail_failed','detail_status_counts',
                'historical_detail_cache_eligible','historical_detail_cache_expired','historical_detail_cache_carried_age',
                'historical_prefill_attempted','historical_prefill_used','historical_prefill_rejected',
                'relay_recovery_candidates','relay_recovery_attempts','relay_recovery_success','relay_recovery_failed',
                'historical_fallback_attempted','historical_fallback_used','historical_fallback_rejected','coverage_complete']
          out={k:m.get(k) for k in keys}
          print('ISSUE_C_CACHE_FIRST',json.dumps(out,sort_keys=True))
          assert m['coverage_complete'] is True
          assert m['pages_fetched'] == 10 and m['unique_cards'] == 100
          assert not m['card_count_mismatches']
          assert m['historical_detail_cache_expired'] == 0
          assert m['historical_detail_cache_carried_age'] >= 1
          PY
