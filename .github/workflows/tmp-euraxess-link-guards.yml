name: Temporary EURAXESS link guard validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-cloud.txt
      - name: Apply EURAXESS link guards
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('sources/euraxess.py')
          s = p.read_text(encoding='utf-8')
          old = 'import time\nfrom bs4 import BeautifulSoup\n'
          new = 'import time\nfrom urllib.parse import urlparse\nfrom bs4 import BeautifulSoup\n'
          if old not in s:
              raise SystemExit('euraxess import anchor missing')
          s = s.replace(old, new, 1)

          old = '''        href = link.get("href", "")\n        title = _clean(link.get_text(" ", strip=True))\n        m_id = re.search(r"/jobs/(\\d+)(?:$|[/?#])", href)\n        if not m_id or not title or len(title) < 8:\n            continue\n        job_id = m_id.group(1)\n'''
          new = '''        href = link.get("href", "")\n        title = _clean(link.get_text(" ", strip=True))\n        parsed_href = urlparse(href)\n        if parsed_href.netloc and parsed_href.hostname not in {\n            "euraxess.ec.europa.eu", "www.euraxess.es", "euraxess.es"\n        }:\n            continue\n        href_path = parsed_href.path or href\n        m_id = re.search(r"/jobs/(\\d+)(?:$|[/?#])", href_path)\n        if not m_id or not title or len(title) < 8:\n            continue\n        job_id = m_id.group(1)\n'''
          if old not in s:
              raise SystemExit('euraxess parser anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('sources/euraxess_transport.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _next_listing_url(html: str, base_url: str) -> str | None:\n    soup = BeautifulSoup(html or '', 'html.parser')\n    for a in soup.find_all('a', href=True):\n        label = ' '.join([\n            a.get_text(' ', strip=True), str(a.get('aria-label') or ''), str(a.get('title') or '')\n        ]).strip().lower()\n        rel = a.get('rel') or []\n        if 'next' not in rel and not re.search(r'\\b(next|more jobs|suivant|suivante|volgende|weiter|nächste)\\b|^[›»>]$', label):\n            continue\n        if a.get('aria-disabled') == 'true' or 'disabled' in (a.get('class') or []):\n            continue\n        href = str(a['href'])\n        if href.startswith(('#', 'javascript:')):\n            continue\n        url = urljoin(base_url, href)\n        if urlparse(url).netloc == urlparse(base_url).netloc:\n            return url\n    return None\n'''
          new = '''def _next_listing_url(html: str, base_url: str) -> str | None:\n    soup = BeautifulSoup(html or '', 'html.parser')\n    base = urlparse(base_url)\n    listing_path = (base.path or SEARCH_PATH).rstrip('/') or '/'\n    preferred: list[str] = []\n    fallback: list[str] = []\n    for a in soup.find_all('a', href=True):\n        label = ' '.join([\n            a.get_text(' ', strip=True), str(a.get('aria-label') or ''), str(a.get('title') or '')\n        ]).strip().lower()\n        rel = a.get('rel') or []\n        if 'next' not in rel and not re.search(r'\\b(next|more jobs|suivant|suivante|volgende|weiter|nächste)\\b|^[›»>]$', label):\n            continue\n        if a.get('aria-disabled') == 'true' or 'disabled' in (a.get('class') or []):\n            continue\n        href = str(a['href'])\n        if href.startswith(('#', 'javascript:')):\n            continue\n        url = urljoin(base_url, href)\n        parsed = urlparse(url)\n        if parsed.netloc != base.netloc:\n            continue\n        candidate_path = (parsed.path or '/').rstrip('/') or '/'\n        if candidate_path == listing_path:\n            preferred.append(url)\n        else:\n            fallback.append(url)\n    return preferred[0] if preferred else (fallback[0] if fallback else None)\n'''
          if old not in s:
              raise SystemExit('next listing anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_v203_euraxess_resilient_transport.py')
          s = p.read_text(encoding='utf-8')
          old = 'from sources import euraxess_transport as transport\n'
          new = 'from sources import euraxess\nfrom sources import euraxess_transport as transport\n'
          if old not in s:
              raise SystemExit('test import anchor missing')
          s = s.replace(old, new, 1)
          s += '''\n\ndef test_parser_rejects_external_jobs_path_links():\n    html = \"\"\"\n    <div><a href=\"https://www.science.hr/jobs/244480/\">External Research Job</a> JOB Spain External Org Posted on: 20 September 2026 Work Locations: Spain</div>\n    <div><a href=\"/jobs/470367\">EURAXESS Research Job</a> JOB Spain Internal Org Posted on: 20 September 2026 Work Locations: Spain</div>\n    \"\"\"\n    rows = euraxess.parse_search_html(html)\n    assert [row['id'] for row in rows] == ['470367']\n    assert rows[0]['url'] == 'https://euraxess.ec.europa.eu/jobs/470367'\n\n\ndef test_next_listing_prefers_listing_path_over_job_detail():\n    html = \"\"\"\n    <a rel=\"next\" href=\"/jobs/470367\">Next job</a>\n    <a rel=\"next\" href=\"/jobs/search?page=1\">Next</a>\n    \"\"\"\n    assert transport._next_listing_url(\n        html, 'https://euraxess.ec.europa.eu/jobs/search?page=0'\n    ) == 'https://euraxess.ec.europa.eu/jobs/search?page=1'\n\n\ndef test_next_listing_keeps_cross_path_fallback_when_no_listing_path_exists():\n    html = '<a rel=\"next\" href=\"/alternative?page=2\">Next</a>'\n    assert transport._next_listing_url(\n        html, 'https://euraxess.ec.europa.eu/jobs/search?page=1'\n    ) == 'https://euraxess.ec.europa.eu/alternative?page=2'\n'''
          p.write_text(s, encoding='utf-8')
          PY
      - name: Focused regressions and scoring freeze
        run: |
          python -m pytest -q tests/test_v186_euraxess_recall_health.py tests/test_v203_euraxess_resilient_transport.py
          python - <<'PY'
          from pathlib import Path
          from jobbot.production import assert_scoring_freeze
          result = assert_scoring_freeze(Path('.').resolve())
          print(result)
          assert result['ok'] is True
          PY
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/euraxess.py sources/euraxess_transport.py tests/test_v203_euraxess_resilient_transport.py
          git commit -m "Guard EURAXESS job and pagination links"
          git push origin main
