name: Issue C Madrid Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-c-madrid-baseline.yml"

permissions:
  contents: read

concurrency:
  group: issue-c-madrid-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      MADRID_RELAY_URL: ${{ vars.MADRID_RELAY_URL }}
      MADRID_RELAY_TOKEN: ${{ secrets.MADRID_RELAY_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-cloud.txt
      - name: Verify relay
        run: |
          test -n "${MADRID_RELAY_URL:-}"
          test -n "${MADRID_RELAY_TOKEN:-}"
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health" >/dev/null
      - name: Run Madrid production-shaped baseline
        run: |
          mkdir -p runtime/c
          START=$(date +%s)
          python run_live_sample.py \
            --source madrid \
            --no-state \
            --out runtime/c \
            | tee runtime/c/stdout.log
          END=$(date +%s)
          echo "ISSUE_C_ELAPSED_SECONDS=$((END-START))"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/c/run_summary.json')
          d=json.loads(p.read_text())
          m=(d.get('source_diagnostics') or {}).get('madrid') or {}
          keys=[
            'pages_requested','pages_fetched','parsed_cards','unique_cards','card_count_mismatches',
            'detail_workers_requested','detail_workers','relay_detail_worker_cap','detail_attempts',
            'detail_success','detail_failed','detail_status_counts','poem_transport_counts',
            'relay_recovery_candidates','relay_recovery_attempts','relay_recovery_success','relay_recovery_failed',
            'fresh_detail_failed','historical_fallback_attempted','historical_fallback_used','historical_fallback_rejected',
            'historical_detail_cache_loaded','historical_detail_cache_eligible','historical_detail_cache_expired',
            'historical_detail_cache_carried_age','coverage_complete','coverage_warning'
          ]
          print('ISSUE_C_BASELINE', json.dumps({k:m.get(k) for k in keys}, sort_keys=True))
          PY
      - name: Run Madrid regressions
        run: |
          pytest -q tests -k "madrid and not live"
