name: Temporary EURAXESS Merge Validation
on:
  push:
    branches:
      - fix/euraxess-cache-coverage-production-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-cloud.txt pytest
      - run: python -m compileall -q sources/euraxess.py sources/euraxess_transport.py scripts/r2_store.py
      - name: Verify frozen scoring
        run: |
          python - <<'PY'
          from pathlib import Path
          from jobbot.production import assert_scoring_freeze
          print(assert_scoring_freeze(Path('.').resolve()))
          PY
      - name: Tests
        run: python -m pytest -q tests/test_euraxess_pagination_coverage.py tests/test_v186_euraxess_recall_health.py tests/test_v203_euraxess_resilient_transport.py tests/test_v174_state_detail_degradation_guard.py tests/test_v188_evaluator_calibration.py -k 'not test_v174_manifest'
