name: Weekly Collector and Evaluator Audit Export

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Last day of audit window (YYYY-MM-DD, inclusive); blank = today UTC"
        required: false
        type: string
      days:
        description: "Number of calendar days (default 7)"
        required: false
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only R2 client
        run: python -m pip install boto3

      - name: Export selected production runs from R2
        env:
          END_DATE: ${{ inputs.end_date }}
          DAYS: ${{ inputs.days }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--out runtime/weekly_audit --days "${DAYS:-7}")
          if [ -n "${END_DATE:-}" ]; then args+=(--end-date "$END_DATE"); fi
          python scripts/weekly_r2_audit_export.py "${args[@]}"

      - name: Add export manifest to job summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f runtime/weekly_audit/README.md ]; then
            cat runtime/weekly_audit/README.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload weekly audit ZIP artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/weekly_audit/
          if-no-files-found: warn
          retention-days: 30
