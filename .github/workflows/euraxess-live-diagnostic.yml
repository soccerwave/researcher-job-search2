name: EURAXESS Live Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/euraxess-live-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live EURAXESS search form and Spain filtering
        shell: bash
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -L -sS -A "$UA" 'https://euraxess.ec.europa.eu/jobs/search' -o /tmp/search.html
          echo "HTML_CHARS=$(wc -c </tmp/search.html)"
          echo "=== country/facet snippets ==="
          grep -Eio '.{0,180}(job_country|country[^<]{0,80}|Spain|España).{0,240}' /tmp/search.html | head -80 || true
          echo "=== form control names ==="
          grep -Eio '<(input|select)[^>]+(name|id)="[^"]+"[^>]*>' /tmp/search.html | grep -Ei 'country|field|keyword|search|filter' | head -100 || true
          echo "=== search form contract ==="
          python - <<'PY'
          import re, html
          raw=open('/tmp/search.html',encoding='utf-8',errors='ignore').read()
          pos=raw.find('name="job_country')
          start=raw.rfind('<form',0,pos)
          end=raw.find('</form>',pos)
          form=raw[start:end+7] if start>=0 and end>=0 else ''
          mt=re.search(r'<form([^>]*)>',form,re.I)
          print("FORM_TAG=", html.unescape(mt.group(0)) if mt else "NONE")
          for m in re.finditer(r'<(?:input|select|button)([^>]*)>',form,re.I):
              tag=m.group(0)
              if re.search(r'\b(name|type|value|data-drupal-selector|id)=',tag,re.I):
                  print("CONTROL=",html.unescape(re.sub(r'\s+',' ',tag))[:500])
          PY
          echo "=== GLOBAL NEWEST DEPTH PROBE ==="
          python - <<'PY'
          import re, html, time, urllib.parse, urllib.request
          base='https://euraxess.ec.europa.eu/jobs/search'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          total_unique=set(); spain_unique=set()
          for page in range(25):
              params={
                  'f[0]':'offer_type:job_offer',
                  'sort[name]':'created',
                  'sort[direction]':'DESC',
                  'page':str(page),
              }
              url=base+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml'})
              try:
                  resp=urllib.request.urlopen(req,timeout=30)
                  raw=resp.read().decode('utf-8','ignore')
                  status=resp.status
              except Exception as e:
                  print(f'DEPTH page={page} ERROR={type(e).__name__}:{e}')
                  break
              # Split on teaser cards and inspect each card independently.
              chunks=re.split(r'id="job-teaser-content"',raw,re.I)[1:]
              ids=[]; spain=[]; dates=[]
              for c in chunks:
                  m=re.search(r'href="[^"]*/jobs/(\d+)[^"]*"',c,re.I)
                  if not m: continue
                  jid=m.group(1); ids.append(jid); total_unique.add(jid)
                  cm=re.search(r'ecl-label[^>]*ecl-label--highlight[^>]*>\s*([^<]+)',c,re.I)
                  country=html.unescape(cm.group(1)).strip() if cm else ''
                  dm=re.search(r'Posted on:\s*(\d{1,2}\s+[A-Za-z]+\s+\d{4})',re.sub(r'<[^>]+>',' ',c),re.I)
                  if dm: dates.append(dm.group(1))
                  if country.lower()=='spain':
                      spain.append(jid); spain_unique.add(jid)
              print(f'DEPTH page={page} status={status} cards={len(ids)} unique_total={len(total_unique)} spain={len(spain)} spain_unique={len(spain_unique)} dates={dates[:1]}..{dates[-1:] if dates else []}')
              if spain:
                  print('DEPTH_SPAIN_IDS=',','.join(spain))
              time.sleep(0.7)
          print('DEPTH_FINAL unique_total=',len(total_unique),'spain_unique=',len(spain_unique))
          PY
          echo "=== POST filter probe ==="
          python - <<'PY'
          import re, html, urllib.parse, urllib.request, http.cookiejar
          base='https://euraxess.ec.europa.eu/jobs/search'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          req=urllib.request.Request(base,headers={'User-Agent':ua})
          raw=opener.open(req,timeout=30).read().decode('utf-8','ignore')
          def hidden(name):
              m=re.search(r'name="'+re.escape(name)+r'" value="([^"]*)"',raw,re.I)
              return html.unescape(m.group(1)) if m else ''
          payload=[
              ('job_country[]','788'),
              ('form_build_id',hidden('form_build_id')),
              ('form_id','oe_list_pages_facets_form'),
              ('op','Apply filters'),
          ]
          data=urllib.parse.urlencode(payload).encode()
          req=urllib.request.Request(base,data=data,headers={
              'User-Agent':ua,
              'Content-Type':'application/x-www-form-urlencoded',
              'Referer':base,
          })
          resp=opener.open(req,timeout=30)
          body=resp.read().decode('utf-8','ignore')
          open('/tmp/postfilter.html','w').write(body)
          print('POST_FINAL_URL=',resp.geturl())
          print('POST_STATUS=',resp.status)
          print('POST_COOKIE_COUNT=',len(list(cj)))
          for pat in [r'Showing results[^<]{0,80}',r'Search results[^<]{0,80}']:
              m=re.search(pat,body,re.I)
              if m: print('POST_SUMMARY=',re.sub(r'\s+',' ',m.group(0)))
          print('POST_SPAIN_COUNT=',len(re.findall(r'>\s*Spain\s*<',body,re.I)))
          print('POST_SWEDEN_COUNT=',len(re.findall(r'>\s*Sweden\s*<',body,re.I)))
          cards=re.findall(r'<a[^>]+href="([^"]*/jobs/\d+[^"]*)"[^>]*>([\s\S]*?)</a>',body,re.I)
          print('POST_JOB_LINKS=',len(cards))
          for href,title in cards[:12]:
              txt=html.unescape(re.sub(r'<[^>]+>',' ',title))
              print('POST_JOB=',href,re.sub(r'\s+',' ',txt).strip()[:120])
          PY
          echo "=== parsed country option ==="
          python - <<'PY'
          import re, html
          raw=open('/tmp/search.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'<select[^>]+name="job_country(?:&#x5B;&#x5D;|\[\])"[^>]*>([\s\S]*?)</select>', raw, re.I)
          print("SELECT_FOUND=", bool(m))
          val=''
          if m:
              for opt in re.finditer(r'<option([^>]*)>([\s\S]*?)</option>', m.group(1), re.I):
                  attrs=opt.group(1)
                  text=re.sub(r'<[^>]+>',' ',opt.group(2))
                  text=html.unescape(re.sub(r'\s+',' ',text)).strip()
                  if text.lower()=='spain':
                      vm=re.search(r'value="([^"]*)"', attrs, re.I)
                      val=html.unescape(vm.group(1)) if vm else ''
                      print("SPAIN_OPTION_VALUE=", repr(val))
                      print("SPAIN_OPTION_TEXT=", repr(text))
          open('/tmp/spain_value.txt','w').write(val)
          PY
          SPAIN_RAW=$(cat /tmp/spain_value.txt)
          echo "SPAIN_RAW=$SPAIN_RAW"
          if [ -n "$SPAIN_RAW" ]; then
            SPAIN_VALUE=$(python -c 'import urllib.parse; print(urllib.parse.quote(open("/tmp/spain_value.txt").read(), safe=""))')
            echo "SPAIN_VALUE_ENCODED=$SPAIN_VALUE"
            curl -L -sS -A "$UA" "https://euraxess.ec.europa.eu/jobs/search?job_country%5B%5D=$SPAIN_VALUE" -o /tmp/newfilter.html
            echo "NEWFILTER_SPAIN_COUNT=$(grep -oi '>Spain<' /tmp/newfilter.html | wc -l || true)"
            echo "NEWFILTER_SWEDEN_COUNT=$(grep -oi '>Sweden<' /tmp/newfilter.html | wc -l || true)"
            grep -Eio 'Search results[^<]{0,80}|Showing results[^<]{0,80}' /tmp/newfilter.html | head -10 || true
          fi
          echo "=== f[0] legacy URL ==="
          curl -L -sS -A "$UA" -w '\nHTTP=%{http_code} FINAL=%{url_effective}\n'             'https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_country%3A788' -o /tmp/legacy.html
          grep -Eio 'Search results[^<]{0,80}|Showing results[^<]{0,80}|JOB[^<]{0,120}Spain' /tmp/legacy.html | head -20 || true
          echo "LEGACY_SPAIN_COUNT=$(grep -oi '>Spain<' /tmp/legacy.html | wc -l || true)"
          echo "LEGACY_SWEDEN_COUNT=$(grep -oi '>Sweden<' /tmp/legacy.html | wc -l || true)"
