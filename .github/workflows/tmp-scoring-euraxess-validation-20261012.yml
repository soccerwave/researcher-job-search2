name: Temporary Scoring and EURAXESS Validation 2026-10-12
# Rerun after mock row-parser correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-scoring-euraxess-validation-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify scorer manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from jobbot.production import assert_scoring_freeze
          print(assert_scoring_freeze(Path('.').resolve()))
          PY
      - name: Run evaluator and EURAXESS regressions
        run: |
          python -m pytest -q \
            tests/test_evaluator_targeted_20261011.py \
            tests/test_euraxess_pagination_coverage.py \
            tests/test_scoring_v142_junior_researcher_recall.py \
            tests/test_scoring_v141_project_pm_precision.py \
            tests/test_v140_research_pm_recall.py \
            tests/test_v188_evaluator_calibration.py
