name: Issue B Post Migration Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-b-post-migration-verify.yml"

permissions:
  contents: read

concurrency:
  group: production-job-search
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-cloud.txt
      - name: Download and verify current production state read-only
        run: |
          mkdir -p runtime/state runtime/verify
          python scripts/r2_store.py download-state --dest runtime/state/remote_before.json
          cp runtime/state/remote_before.json runtime/state/simulation.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path = Path("runtime/state/remote_before.json")
          sha = hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha == "c9ad15c63e28b6726df6cffa791654b79edeca685e5cb359f92a986967829805", sha
          data = json.loads(path.read_text(encoding="utf-8"))
          assert len(data["jobs"]) == 3516
          a = data["jobs"]["job_44f809ec70f4392a9a92"]
          b = data["jobs"]["job_97ad9a722e6b6988aa06"]
          assert a["times_seen"] == 19
          assert b["times_seen"] == 5
          assert b["first_seen"] == "2026-09-30"
          assert b["last_seen"] == "2026-10-04"
          assert "url:https://researchmar.net/ofertes/en_detall-oferta-temporals.html?id=3412" in a["aliases"]
          assert "source_id:hospital_del_mar_research_institute:3433" in b["aliases"]
          assert "url:https://researchmar.net/ofertes/en_detall-oferta-temporals.html?id=3433" in b["aliases"]
          print("ISSUE_B_REMOTE_STATE_OK", sha, len(data["jobs"]))
          PY
      - name: Collect current Hospital del Mar source
        run: |
          python run_live_sample.py \
            --source hospitaldelmar \
            --state-file runtime/state/simulation.json \
            --out runtime/verify \
            | tee runtime/verify_stdout.json
      - name: Replay live rows against downloaded production state copy
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from jobbot.state import apply_seen_state

          csv_rows = list(csv.DictReader(Path("runtime/verify/all_canonical.csv").open(encoding="utf-8-sig", newline="")))
          hospital = [r for r in csv_rows if r.get("source") == "Hospital del Mar Research Institute"]
          assert len(hospital) == 9, len(hospital)
          rows = []
          for r in hospital:
              try:
                  score = int(float(r.get("score"))) if str(r.get("score") or "").strip() else None
              except ValueError:
                  score = None
              rows.append({
                  "source": r.get("source"), "id": r.get("id"), "title": r.get("title"),
                  "company": r.get("company"), "location": r.get("location"), "url": r.get("url"),
                  "trusted_full_detail_url": r.get("trusted_full_detail_url") or r.get("url"),
                  "modality": r.get("modality"), "application_deadline": r.get("application_deadline"),
                  "application_status": r.get("application_status"), "recommendation": r.get("recommendation"),
                  "score": score, "detail_status": r.get("detail_status"), "full_detail": r.get("full_detail"),
              })

          stats = apply_seen_state(rows, Path("runtime/state/simulation.json"), "2026-10-04")
          a = [r for r in rows if str(r.get("url") or "").endswith("?id=3412")]
          b = [r for r in rows if str(r.get("url") or "").endswith("?id=3433")]
          assert len(a) == 1 and len(b) == 1
          a, b = a[0], b[0]
          assert a["id"] == "FIMIM3317-DOPAZO"
          assert b["id"] == "3433"
          assert a["state_id"] == "job_44f809ec70f4392a9a92"
          assert b["state_id"] == "job_97ad9a722e6b6988aa06"
          assert a["seen_status"] == "SEEN"
          assert b["seen_status"] == "SEEN"
          assert stats["NEW"] == 0
          assert stats["SEEN"] == 9
          assert stats["state_jobs"] == 3516
          print("ISSUE_B_LIVE_REPLAY_OK", json.dumps({"3412": a["state_id"], "3433": b["state_id"], "stats": stats}, sort_keys=True))
          PY
      - name: Re-download production state and prove verification was read-only
        run: |
          python scripts/r2_store.py download-state --dest runtime/state/remote_after.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = "c9ad15c63e28b6726df6cffa791654b79edeca685e5cb359f92a986967829805"
          before = hashlib.sha256(Path("runtime/state/remote_before.json").read_bytes()).hexdigest()
          after = hashlib.sha256(Path("runtime/state/remote_after.json").read_bytes()).hexdigest()
          assert before == expected
          assert after == expected
          print("ISSUE_B_REMOTE_UNCHANGED", before, after)
          PY
      - name: Run Issue B regression pack
        run: |
          pytest -q \
            tests/test_v198_state_identity_collision.py \
            tests/test_v174_state_detail_degradation_guard.py \
            tests/test_v162_durable_production_state.py \
            tests/test_v115_cross_source_dedupe.py \
            tests/test_v149_query_identity_dedupe.py \
            tests/test_v148_hospital_del_mar.py \
            -k "not manifest"
