name: EURAXESS R2 Isolated Cache Roundtrip
on:
  push:
    branches:
      - experiment/euraxess-coverage-detail-cache-20261019
    paths:
      - .github/workflows/euraxess-r2-isolated-roundtrip.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
  R2_EURAXESS_CACHE_KEY: experiments/euraxess-r2-roundtrip-20261019.json
jobs:
  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - name: Publish synthetic valid cache to isolated key
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          p=Path('/tmp/euraxess_test_cache.json')
          stamp=datetime.now(timezone.utc).isoformat()
          url='https://euraxess.ec.europa.eu/jobs/987654321'
          detail='Job Information Country Spain Offer Description Research Project Manager'
          p.write_text(json.dumps({url:{'detail':detail,'status':'OK_HTML','fetched_at':stamp}}))
          PY
          python scripts/r2_store.py upload-euraxess-cache --file /tmp/euraxess_test_cache.json
  reader:
    needs: writer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 beautifulsoup4 requests
      - name: Restore cache on independent runner and validate reuse
        run: |
          python scripts/r2_store.py download-euraxess-cache --dest /tmp/euraxess_restored.json
          python - <<'PY'
          from pathlib import Path
          import json
          import sources.euraxess as euraxess
          p=Path('/tmp/euraxess_restored.json')
          data=json.loads(p.read_text())
          url='https://euraxess.ec.europa.eu/jobs/987654321'
          assert url in data
          assert euraxess._valid_euraxess_detail(data[url]['detail'])
          assert data[url]['status']=='OK_HTML'
          print('INDEPENDENT_RUNNER_R2_ROUNDTRIP_OK entries=', len(data))
          PY
