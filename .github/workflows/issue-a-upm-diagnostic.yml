name: Issue A UPM recall diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-a-upm-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      CANONICAL_KEY: runs/2026-10-04/37173668452-1/all_canonical.csv.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-cloud.txt
      - name: Download immutable Oct 4 canonical snapshot
        run: |
          python - <<'PY'
          import os,boto3
          endpoint=os.environ.get('R2_ENDPOINT') or f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com"
          s3=boto3.client('s3',endpoint_url=endpoint,aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto')
          s3.download_file(os.environ['R2_BUCKET'],os.environ['CANONICAL_KEY'],'/tmp/all_canonical.csv.gz')
          PY
      - name: Trace UPM vacancy under V1.41
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import csv,gzip,json
          from jobbot.evaluate import evaluate_job,detect_domain,detect_family,_generic_project_delivery_mismatch
          from jobbot.normalize import clean_text,normalize
          with gzip.open('/tmp/all_canonical.csv.gz','rt',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          hits=[]
          for row in rows:
              if clean_text(row.get('title')).lower() == 'project manager / junior researcher':
                  hits.append(row)
          assert len(hits)==1, f'expected one exact UPM target, found {len(hits)}'
          row=hits[0]
          title=clean_text(row.get('title'))
          jd=clean_text(row.get('full_detail') or row.get('description'))
          norm=normalize(f'{title}\n{jd}')
          family,patterns=detect_family(title)
          domain,domain_hits,distant_hits=detect_domain(norm)
          mismatch,mismatch_reason=_generic_project_delivery_mismatch(title,norm)
          result=evaluate_job(row)
          print(json.dumps({
              'title':title,
              'company':row.get('company') or row.get('employer'),
              'source':row.get('source'),
              'url':row.get('url') or row.get('job_url') or row.get('detail_url'),
              'source_id':row.get('source_id') or row.get('job_id') or row.get('external_id'),
              'detail_status':row.get('detail_status'),
              'initial_family':family,
              'family_patterns':patterns,
              'initial_domain':domain,
              'domain_hits':domain_hits,
              'distant_hits':distant_hits,
              'generic_project_delivery_mismatch':mismatch,
              'mismatch_reason':mismatch_reason,
              'evaluation':{k:result.get(k) for k in ['score','recommendation','job_family','domain_category','fit_signals','partial_matches','missing_requirements','blockers']},
              'full_detail':jd,
          },ensure_ascii=False,indent=2))
          PY