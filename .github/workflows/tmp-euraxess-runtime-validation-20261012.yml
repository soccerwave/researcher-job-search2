name: Temporary EURAXESS Runtime Regression 2026-10-12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-euraxess-runtime-validation-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-cloud.txt pytest
      - name: Verify scoring freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          from jobbot.production import assert_scoring_freeze
          print(assert_scoring_freeze(Path('.').resolve()))
          PY
      - name: Validate Python compilation
        run: python -m compileall -q sources/euraxess.py sources/euraxess_transport.py run_live_sample.py
      - name: Run EURAXESS, evaluator and production regressions
        run: |
          python -m pytest -q \
            tests/test_euraxess_pagination_coverage.py \
            tests/test_v203_euraxess_resilient_transport.py \
            tests/test_v186_euraxess_recall_health.py \
            tests/test_evaluator_targeted_20261011.py \
            tests/test_v137_production_orchestration.py \
            tests/test_v162_durable_production_state.py \
            tests/test_v188_evaluator_calibration.py
