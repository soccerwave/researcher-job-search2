name: Issue C Final Madrid Release V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-c-final-release-v2.yml"

permissions:
  contents: write

concurrency:
  group: production-job-search
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      MADRID_RELAY_URL: ${{ vars.MADRID_RELAY_URL }}
      MADRID_RELAY_TOKEN: ${{ secrets.MADRID_RELAY_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-cloud.txt

      - name: Build candidate locally
        run: |
          python scripts/issue_c_candidate_patch.py
          cat > tests/test_v202_madrid_cache_first_rescue.py <<'PY'
          import csv
          import gzip
          import time
          from pathlib import Path
          from sources import madrid_idi_history as history

          def _write(path: Path, rows: list[dict]):
              fields=["source","id","title","company","url","full_detail","detail_status","detail_age_days","availability_as_of","last_seen","detail_resolved_url","trusted_full_detail_url"]
              with gzip.open(path,"wt",encoding="utf-8-sig",newline="") as f:
                  w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          def _row(job_id="A1", title="Researcher", company="Institute"):
              return {"source":"Madrid I+D+i","id":job_id,"title":title,"company":company,"url":f"https://example.test/{job_id}"}

          def test_prefill_exact_recent_match_only(tmp_path, monkeypatch):
              p=tmp_path/"h.csv.gz"
              _write(p,[{"source":"Madrid I+D+i","id":"A1","title":"Researcher","company":"Institute","url":"https://example.test/A1","full_detail":"trusted detail","detail_status":"OK","detail_age_days":"0","availability_as_of":"2026-10-04","last_seen":"2026-10-04","detail_resolved_url":"https://example.test/A1","trusted_full_detail_url":"https://example.test/A1"}])
              monkeypatch.setenv("MADRID_HISTORY_CANONICAL_PATH",str(p))
              hit=_row(); changed=_row(title="Senior Researcher"); diag={}
              hits,misses=history._prefill_recent_history([hit,changed],diag)
              assert hits==[hit] and misses==[changed]
              assert hit["detail_status"]=="CACHE" and hit["detail_fetch_status"]=="CACHE_PREFILL"
              assert diag["historical_prefill_used"]==1 and diag["historical_prefill_rejected"]==1

          def test_prefill_respects_effective_age(tmp_path, monkeypatch):
              p=tmp_path/"h.csv.gz"
              _write(p,[{"source":"Madrid I+D+i","id":"A1","title":"Researcher","company":"Institute","url":"https://example.test/A1","full_detail":"old detail","detail_status":"CACHE","detail_age_days":"2","availability_as_of":"2026-10-03","last_seen":"2026-10-03","detail_resolved_url":"https://example.test/A1","trusted_full_detail_url":"https://example.test/A1"}])
              monkeypatch.setenv("MADRID_HISTORY_CANONICAL_PATH",str(p))
              import datetime
              monkeypatch.setattr(history,"date",type("FixedDate",(),{"today":staticmethod(lambda:datetime.date(2026,10,4))}))
              row=_row(); diag={}; hits,misses=history._prefill_recent_history([row],diag)
              assert hits==[] and misses==[row]
              assert diag["historical_detail_cache_expired"]==1

          def test_final_rescue_only_transient_misses(monkeypatch):
              rows=[{**_row("A1"),"detail_status":"POEM_RELAY_HTTP_504"},{**_row("A2"),"detail_status":"OK","full_detail":"good"},{**_row("A3"),"detail_status":"POEM_RELAY_HTTP_503"}]
              calls=[]
              monkeypatch.setattr(time,"sleep",lambda *_:None)
              monkeypatch.setattr(history.base,"_resolve_detail_row",lambda i,row,timeout:(calls.append(row["id"]) or (i,"fresh detail","OK",row["url"],"poem_api")))
              diag={"detail_failed":2,"detail_success":1,"detail_status_counts":{"POEM_RELAY_HTTP_504":1,"POEM_RELAY_HTTP_503":1,"OK":1},"poem_api_success":0,"detail_resolved_via_poem_api":0,"detail_resolved_via_poem":0}
              history._rescue_remaining_fresh_misses(rows,diag)
              assert sorted(calls)==["A1","A3"]
              assert diag["final_rescue_attempts"]==2 and diag["final_rescue_success"]==2
              assert diag["detail_failed"]==0 and diag["detail_success"]==3
          PY

      - name: Focused regression pack
        env:
          MADRID_RELAY_URL: ""
          MADRID_RELAY_TOKEN: ""
        run: |
          pytest -q \
            tests/test_v172_madrid_relay_backpressure.py \
            tests/test_v173_madrid_deferred_relay_recovery.py \
            tests/test_v201_madrid_cache_age.py \
            tests/test_v202_madrid_cache_first_rescue.py \
            -k "not manifest"

      - name: Deploy candidate relay at 12 seconds
        working-directory: cloudflare-madrid-relay
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@latest deploy
          sleep 3
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health"

      - name: Production-shaped live validation
        run: |
          mkdir -p runtime/c
          START=$(date +%s)
          python run_live_sample.py --source madrid --no-state --out runtime/c | tee runtime/c/stdout.log
          END=$(date +%s)
          echo "ISSUE_C_FINAL_ELAPSED_SECONDS=$((END-START))"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runtime/c/run_summary.json').read_text())
          m=d['source_diagnostics']['madrid']
          assert m['coverage_complete'] is True
          assert m['pages_fetched']==10 and m['parsed_cards']==100 and m['unique_cards']==100
          assert not m['card_count_mismatches']
          assert m['detail_success'] + m['detail_failed'] == 100
          assert m['historical_prefill_used'] >= 80
          assert m['fresh_detail_attempts'] <= 20
          assert m['historical_detail_cache_expired'] == 0
          assert m['historical_detail_cache_carried_age'] >= 1
          assert m['detail_failed'] <= 1, m
          assert d['source_runs']['madrid']['elapsed_seconds'] <= 180, d['source_runs']['madrid']
          print('ISSUE_C_FINAL_LIVE_OK',json.dumps({
              'detail_success':m['detail_success'],'detail_failed':m['detail_failed'],
              'detail_status_counts':m['detail_status_counts'],
              'historical_prefill_used':m['historical_prefill_used'],
              'fresh_detail_attempts':m['fresh_detail_attempts'],
              'relay_recovery_candidates':m.get('relay_recovery_candidates'),
              'relay_recovery_success':m.get('relay_recovery_success'),
              'relay_recovery_failed':m.get('relay_recovery_failed'),
              'final_rescue_candidates':m.get('final_rescue_candidates'),
              'final_rescue_success':m.get('final_rescue_success'),
              'final_rescue_failed':m.get('final_rescue_failed'),
              'elapsed_seconds':d['source_runs']['madrid']['elapsed_seconds']
          },sort_keys=True))
          PY

      - name: Update release lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('jobbot/production.py'); s=p.read_text(encoding='utf-8')
          old='PRODUCTION_VERSION = "V2.04_STATE_IDENTITY_COLLISION_REPAIR"'
          new='PRODUCTION_VERSION = "V2.05_MADRID_RELAY_RELIABILITY"'
          assert s.count(old)==1
          p.write_text(s.replace(old,new),encoding='utf-8')
          v=Path('PRODUCTION_VERSION.json'); data=json.loads(v.read_text(encoding='utf-8'))
          assert data['production_version']=='V2.04_STATE_IDENTITY_COLLISION_REPAIR'
          assert data['scoring_engine']=='V1.42_JUNIOR_RESEARCHER_TITLE_RECALL'
          data.update({
            'production_version':'V2.05_MADRID_RELAY_RELIABILITY',
            'scoring_engine':'V1.42_JUNIOR_RESEARCHER_TITLE_RECALL',
            'scope':'Issue C Madrid relay reliability/performance. Cloudflare upstream timeout increased from 6s to 12s; strict recent cache prefill is used only for identical vacancy ID/title/company under the unchanged two-day effective-age policy; new/changed/no-cache vacancies are fresh-fetched; one bounded third rescue attempt is allowed only for remaining transient no-cache failures. Madrid discovery and scoring are unchanged; scoring remains frozen at V1.42.',
            'previous_production_version':'V2.04_STATE_IDENTITY_COLLISION_REPAIR'
          })
          v.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Verify scoring freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jobbot.production as p
          assert p.PRODUCTION_VERSION=='V2.05_MADRID_RELAY_RELIABILITY'
          assert p.FROZEN_ENGINE=='V1.42_JUNIOR_RESEARCHER_TITLE_RECALL'
          result=p.verify_scoring_freeze(Path('.'))
          assert result['ok'] is True, result
          data=json.loads(Path('PRODUCTION_VERSION.json').read_text())
          assert data['production_version']==p.PRODUCTION_VERSION
          assert data['scoring_engine']==p.FROZEN_ENGINE
          print('ISSUE_C_FREEZE_OK',result)
          PY

      - name: Commit V2.05
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            sources/madrid_idi_history.py \
            cloudflare-madrid-relay/src/index.js \
            tests/test_v172_madrid_relay_backpressure.py \
            tests/test_v173_madrid_deferred_relay_recovery.py \
            tests/test_v202_madrid_cache_first_rescue.py \
            jobbot/production.py \
            PRODUCTION_VERSION.json
          git diff --cached --check
          git commit -m "Release V2.05 Madrid relay reliability"
          git push origin HEAD:main

      - name: Verify final deployed relay
        run: |
          grep -q 'const UPSTREAM_TIMEOUT_MS = 12000;' cloudflare-madrid-relay/src/index.js
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health"
          echo "ISSUE_C_FINAL_RELAY_OK=1"

      - name: Roll back relay if release fails
        if: failure()
        working-directory: cloudflare-madrid-relay
        run: |
          git checkout HEAD -- src/index.js || true
          if grep -q 'const UPSTREAM_TIMEOUT_MS = 6000;' src/index.js; then
            npx --yes wrangler@latest deploy
            sleep 3
            curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health"
            echo "ISSUE_C_RELAY_ROLLBACK_TO_6S_OK=1"
          fi
