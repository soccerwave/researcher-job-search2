name: Issue C Relay Timeout12 Experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-c-relay-timeout12-experiment.yml"

permissions:
  contents: read

concurrency:
  group: production-job-search
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      MADRID_RELAY_URL: ${{ vars.MADRID_RELAY_URL }}
      MADRID_RELAY_TOKEN: ${{ secrets.MADRID_RELAY_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-cloud.txt
      - name: Validate Cloudflare credentials and current relay
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${MADRID_RELAY_URL:-}"
          test -n "${MADRID_RELAY_TOKEN:-}"
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health"
      - name: Deploy 12-second relay candidate
        working-directory: cloudflare-madrid-relay
        run: |
          cp src/index.js /tmp/madrid-relay-original.js
          python - <<'PY'
          from pathlib import Path
          p=Path('src/index.js')
          s=p.read_text(encoding='utf-8')
          assert s.count('const UPSTREAM_TIMEOUT_MS = 6000;') == 1
          p.write_text(s.replace('const UPSTREAM_TIMEOUT_MS = 6000;', 'const UPSTREAM_TIMEOUT_MS = 12000;'), encoding='utf-8')
          PY
          npx --yes wrangler@latest deploy
          sleep 3
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health"
      - name: Run original production-shaped Madrid against timeout12 relay
        run: |
          mkdir -p runtime/c
          START=$(date +%s)
          python run_live_sample.py --source madrid --no-state --out runtime/c | tee runtime/c/stdout.log
          END=$(date +%s)
          echo "ISSUE_C_TIMEOUT12_ELAPSED_SECONDS=$((END-START))"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runtime/c/run_summary.json').read_text())
          m=d['source_diagnostics']['madrid']
          keys=['detail_success','detail_failed','detail_status_counts','relay_recovery_candidates',
                'relay_recovery_success','relay_recovery_failed','historical_fallback_used',
                'historical_fallback_rejected','historical_detail_cache_eligible','coverage_complete']
          print('ISSUE_C_TIMEOUT12', json.dumps({k:m.get(k) for k in keys}, sort_keys=True))
          assert m['coverage_complete'] is True
          assert m['pages_fetched'] == 10 and m['unique_cards'] == 100
          assert not m['card_count_mismatches']
          PY
      - name: Restore production relay to 6 seconds
        if: always()
        working-directory: cloudflare-madrid-relay
        run: |
          if [ -f /tmp/madrid-relay-original.js ]; then
            cp /tmp/madrid-relay-original.js src/index.js
            npx --yes wrangler@latest deploy
            sleep 3
            curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health"
            grep -q 'const UPSTREAM_TIMEOUT_MS = 6000;' src/index.js
            echo "ISSUE_C_RELAY_ROLLBACK_OK=1"
          fi
