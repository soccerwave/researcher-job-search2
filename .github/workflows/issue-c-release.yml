name: Issue C Madrid Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-c-release.yml"

permissions:
  contents: write

concurrency:
  group: production-job-search
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      MADRID_RELAY_URL: ${{ vars.MADRID_RELAY_URL }}
      MADRID_RELAY_TOKEN: ${{ secrets.MADRID_RELAY_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-cloud.txt
      - name: Apply Issue C production patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sources/madrid_idi_history.py')
          s=p.read_text(encoding='utf-8')
          old='''def collect(*args, diagnostics: dict | None = None, **kwargs) -> list[dict]:\n    diag = diagnostics if diagnostics is not None else {}\n    rows = base.collect(*args, diagnostics=diag, **kwargs)\n    _apply_historical_fallback(rows, diag)\n    return rows\n'''
          new='''def _prefill_recent_history(rows: list[dict], diagnostics: dict) -> tuple[list[dict], list[dict]]:\n    \"\"\"Use verified recent Full JD cache before hitting the fragile POEM relay.\n\n    Eligibility stays strict: same stable identity, normalized title/company match, and\n    the existing two-day effective-age policy. Cache hits remain explicitly CACHE.\n    \"\"\"\n    path = _download_latest_canonical()\n    cache, cache_diag = _load_cache(path)\n    diagnostics.update(cache_diag)\n    diagnostics[\"historical_prefill_attempted\"] = len(rows)\n    diagnostics[\"historical_prefill_used\"] = 0\n    diagnostics[\"historical_prefill_rejected\"] = 0\n    misses: list[dict] = []\n    hits: list[dict] = []\n    for row in rows:\n        previous = _match_current_to_history(row, cache) if cache else None\n        previous_detail = str((previous or {}).get(\"full_detail\") or \"\").strip()\n        if not previous or not previous_detail:\n            diagnostics[\"historical_prefill_rejected\"] += 1\n            misses.append(row)\n            continue\n        resolved_url = (\n            _clean(previous.get(\"detail_resolved_url\"))\n            or _clean(previous.get(\"trusted_full_detail_url\"))\n            or _clean(previous.get(\"url\"))\n        )\n        row[\"full_detail\"] = previous_detail\n        row[\"detail_status\"] = \"CACHE\"\n        row[\"detail_fetch_status\"] = \"CACHE_PREFILL\"\n        row[\"detail_source\"] = \"historical_prefill\"\n        row[\"detail_resolution_method\"] = \"historical_prefill\"\n        row[\"detail_age_days\"] = int(previous.get(\"_detail_age_days\") or 0)\n        row[\"trusted_full_detail_source\"] = \"Madrid I+D+i historical prefill\"\n        if resolved_url:\n            row[\"detail_resolved_url\"] = resolved_url\n            row[\"trusted_full_detail_url\"] = resolved_url\n        diagnostics[\"historical_prefill_used\"] += 1\n        hits.append(row)\n    return hits, misses\n\n\ndef _rescue_remaining_fresh_misses(rows: list[dict], diagnostics: dict) -> None:\n    \"\"\"Make one bounded third relay attempt only for no-cache transient failures.\n\n    Normal relay behavior remains two attempts. The third attempt exists only after the\n    strict recent-cache prefill has reduced the live set, waits two seconds, and retries\n    at most two offers concurrently. This bounds upstream load while protecting recall\n    for genuinely new or changed vacancies that have no usable cache.\n    \"\"\"\n    import time\n    from concurrent.futures import ThreadPoolExecutor, as_completed\n\n    candidates = [\n        row for row in rows\n        if base._is_retryable_relay_failure(_clean(row.get(\"detail_status\")))\n    ]\n    diagnostics[\"final_rescue_candidates\"] = len(candidates)\n    diagnostics[\"final_rescue_attempts\"] = 0\n    diagnostics[\"final_rescue_workers\"] = 0\n    diagnostics[\"final_rescue_success\"] = 0\n    diagnostics[\"final_rescue_failed\"] = 0\n    if not candidates:\n        return\n\n    time.sleep(2.0)\n    diagnostics[\"final_rescue_attempts\"] = len(candidates)\n    workers = min(2, len(candidates))\n    diagnostics[\"final_rescue_workers\"] = workers\n    with ThreadPoolExecutor(max_workers=workers, thread_name_prefix=\"madrid-final-rescue\") as pool:\n        futures = {\n            pool.submit(base._resolve_detail_row, index, row, (10, 45)): row\n            for index, row in enumerate(candidates)\n        }\n        for future in as_completed(futures):\n            row = futures[future]\n            old_status = _clean(row.get(\"detail_status\"))\n            try:\n                _, detail, status, resolved_url, method = future.result()\n            except Exception as exc:\n                detail = \"\"\n                status = f\"DETAIL_WORKER_FAILED: {type(exc).__name__}: {exc}\"\n                resolved_url = \"\"\n                method = \"worker_failed\"\n            row[\"full_detail\"] = detail\n            row[\"detail_status\"] = status\n            row[\"detail_resolution_method\"] = method\n            row[\"final_rescue_attempted\"] = True\n            if resolved_url:\n                row[\"detail_resolved_url\"] = resolved_url\n\n            if detail and status in base._OK_DETAIL_STATUSES:\n                diagnostics[\"final_rescue_success\"] += 1\n                diagnostics[\"detail_failed\"] = max(0, int(diagnostics.get(\"detail_failed\", 0) or 0) - 1)\n                diagnostics[\"detail_success\"] = int(diagnostics.get(\"detail_success\", 0) or 0) + 1\n                if method == \"poem_api\":\n                    diagnostics[\"poem_api_success\"] = int(diagnostics.get(\"poem_api_success\", 0) or 0) + 1\n                    diagnostics[\"detail_resolved_via_poem_api\"] = int(diagnostics.get(\"detail_resolved_via_poem_api\", 0) or 0) + 1\n                    diagnostics[\"detail_resolved_via_poem\"] = int(diagnostics.get(\"detail_resolved_via_poem\", 0) or 0) + 1\n                elif method == \"external_from_poem_api\":\n                    diagnostics[\"detail_resolved_via_external_api_link\"] = int(diagnostics.get(\"detail_resolved_via_external_api_link\", 0) or 0) + 1\n                    diagnostics[\"detail_resolved_via_external\"] = int(diagnostics.get(\"detail_resolved_via_external\", 0) or 0) + 1\n                counts = dict(diagnostics.get(\"detail_status_counts\") or {})\n                if old_status in counts:\n                    counts[old_status] = max(0, int(counts.get(old_status, 0) or 0) - 1)\n                    if counts[old_status] == 0:\n                        counts.pop(old_status, None)\n                counts[status] = int(counts.get(status, 0) or 0) + 1\n                diagnostics[\"detail_status_counts\"] = counts\n            else:\n                diagnostics[\"final_rescue_failed\"] += 1\n\n\ndef collect(*args, diagnostics: dict | None = None, **kwargs) -> list[dict]:\n    diag = diagnostics if diagnostics is not None else {}\n    enrich_detail = bool(kwargs.pop(\"enrich_detail\", True))\n    if not enrich_detail:\n        return base.collect(*args, diagnostics=diag, enrich_detail=False, **kwargs)\n\n    # Fetch the official listing first without touching the detail relay. Reuse recent\n    # Full JD only for the exact same vacancy/title/company; all new or changed rows go\n    # through normal fresh detail resolution.\n    rows = base.collect(*args, diagnostics=diag, enrich_detail=False, **kwargs)\n    hits, misses = _prefill_recent_history(rows, diag)\n    cache_count = len(hits)\n    diag[\"detail_success\"] = 0\n    diag[\"detail_failed\"] = 0\n    diag[\"detail_attempts\"] = 0\n    diag[\"detail_status_counts\"] = {}\n    diag[\"fresh_detail_attempts\"] = len(misses)\n\n    if misses:\n        workers = int(kwargs.get(\"detail_workers\", 1) or 1)\n        base._enrich_detail_rows(misses, diag, timeout=(10, 45), detail_workers=workers)\n        _rescue_remaining_fresh_misses(misses, diag)\n\n    counts = dict(diag.get(\"detail_status_counts\") or {})\n    if cache_count:\n        counts[\"CACHE\"] = int(counts.get(\"CACHE\", 0) or 0) + cache_count\n    diag[\"detail_status_counts\"] = counts\n    diag[\"detail_success\"] = int(diag.get(\"detail_success\", 0) or 0) + cache_count\n    diag[\"fresh_detail_failed\"] = int(diag.get(\"detail_failed\", 0) or 0)\n\n    # Safety net for a fresh miss whose cache became available/matchable only through\n    # the normal fallback path. The same effective-age rules are reused unchanged.\n    _apply_historical_fallback(rows, diag)\n    return rows\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Add Issue C regression tests
        run: |
          cat > tests/test_v202_madrid_cache_first_rescue.py <<'PY'
          import csv
          import gzip
          from pathlib import Path

          from sources import madrid_idi_history as history


          def _write_history(path: Path, rows: list[dict]):
              fields = [
                  "source", "id", "title", "company", "url", "full_detail",
                  "detail_status", "detail_age_days", "availability_as_of", "last_seen",
                  "detail_resolved_url", "trusted_full_detail_url",
              ]
              with gzip.open(path, "wt", encoding="utf-8-sig", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields)
                  writer.writeheader()
                  for row in rows:
                      writer.writerow(row)


          def _current(job_id="A1", title="Researcher", company="Institute"):
              return {
                  "source": "Madrid I+D+i", "id": job_id, "title": title,
                  "company": company, "url": f"https://example.test/{job_id}",
              }


          def test_v202_prefill_uses_only_exact_recent_identity_title_company(tmp_path, monkeypatch):
              path = tmp_path / "previous.csv.gz"
              _write_history(path, [{
                  "source": "Madrid I+D+i", "id": "A1", "title": "Researcher",
                  "company": "Institute", "url": "https://example.test/A1",
                  "full_detail": "trusted full detail", "detail_status": "OK",
                  "detail_age_days": "0", "availability_as_of": "2026-10-04",
                  "last_seen": "2026-10-04", "detail_resolved_url": "https://example.test/A1",
                  "trusted_full_detail_url": "https://example.test/A1",
              }])
              monkeypatch.setenv("MADRID_HISTORY_CANONICAL_PATH", str(path))
              hit = _current()
              changed = _current(title="Senior Researcher")
              diag = {}
              hits, misses = history._prefill_recent_history([hit, changed], diag)
              assert hits == [hit]
              assert misses == [changed]
              assert hit["detail_status"] == "CACHE"
              assert hit["detail_fetch_status"] == "CACHE_PREFILL"
              assert hit["full_detail"] == "trusted full detail"
              assert diag["historical_prefill_used"] == 1
              assert diag["historical_prefill_rejected"] == 1


          def test_v202_prefill_respects_effective_cache_age_and_never_resets_stale_cache(tmp_path, monkeypatch):
              path = tmp_path / "previous.csv.gz"
              _write_history(path, [{
                  "source": "Madrid I+D+i", "id": "A1", "title": "Researcher",
                  "company": "Institute", "url": "https://example.test/A1",
                  "full_detail": "old cached detail", "detail_status": "CACHE",
                  "detail_age_days": "2", "availability_as_of": "2026-10-03",
                  "last_seen": "2026-10-03", "detail_resolved_url": "https://example.test/A1",
                  "trusted_full_detail_url": "https://example.test/A1",
              }])
              monkeypatch.setenv("MADRID_HISTORY_CANONICAL_PATH", str(path))
              monkeypatch.setattr(history, "date", type("FixedDate", (), {"today": staticmethod(lambda: __import__('datetime').date(2026, 10, 4))}))
              row = _current()
              diag = {}
              hits, misses = history._prefill_recent_history([row], diag)
              assert hits == []
              assert misses == [row]
              assert diag["historical_detail_cache_expired"] == 1
              assert diag["historical_prefill_used"] == 0


          def test_v202_final_rescue_is_bounded_to_transient_misses(monkeypatch):
              rows = [
                  {**_current("A1"), "detail_status": "POEM_RELAY_HTTP_504"},
                  {**_current("A2"), "detail_status": "OK", "full_detail": "already good"},
                  {**_current("A3"), "detail_status": "POEM_RELAY_HTTP_503"},
              ]
              calls = []
              monkeypatch.setattr(history.time if hasattr(history, 'time') else __import__('time'), "sleep", lambda *_: None)
              monkeypatch.setattr(history.base, "_resolve_detail_row", lambda i, row, timeout: (calls.append(row["id"]) or (i, "fresh detail", "OK", row["url"], "poem_api")))
              diag = {
                  "detail_failed": 2, "detail_success": 1,
                  "detail_status_counts": {"POEM_RELAY_HTTP_504": 1, "POEM_RELAY_HTTP_503": 1, "OK": 1},
                  "poem_api_success": 0, "detail_resolved_via_poem_api": 0, "detail_resolved_via_poem": 0,
              }
              history._rescue_remaining_fresh_misses(rows, diag)
              assert sorted(calls) == ["A1", "A3"]
              assert diag["final_rescue_candidates"] == 2
              assert diag["final_rescue_attempts"] == 2
              assert diag["final_rescue_workers"] == 2
              assert diag["final_rescue_success"] == 2
              assert diag["detail_failed"] == 0
              assert diag["detail_success"] == 3
              assert all(row.get("final_rescue_attempted") for row in (rows[0], rows[2]))
              assert not rows[1].get("final_rescue_attempted")
          PY
      - name: Run focused regressions
        env:
          MADRID_RELAY_URL: ""
          MADRID_RELAY_TOKEN: ""
        run: |
          pytest -q \
            tests/test_v172_madrid_relay_backpressure.py \
            tests/test_v173_madrid_deferred_relay_recovery.py \
            tests/test_v201_madrid_cache_age.py \
            tests/test_v202_madrid_cache_first_rescue.py \
            -k "not manifest"
      - name: Validate production-shaped Madrid live
        run: |
          test -n "${MADRID_RELAY_URL:-}"
          test -n "${MADRID_RELAY_TOKEN:-}"
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health" >/dev/null
          mkdir -p runtime/c
          START=$(date +%s)
          python run_live_sample.py --source madrid --no-state --out runtime/c | tee runtime/c/stdout.log
          END=$(date +%s)
          ELAPSED=$((END-START))
          echo "ISSUE_C_RELEASE_ELAPSED_SECONDS=$ELAPSED"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runtime/c/run_summary.json').read_text())
          m=d['source_diagnostics']['madrid']
          assert m['coverage_complete'] is True
          assert m['pages_fetched'] == 10 and m['parsed_cards'] == 100 and m['unique_cards'] == 100
          assert not m['card_count_mismatches']
          assert m['detail_success'] + m['detail_failed'] == 100
          assert m['historical_prefill_used'] >= 80
          assert m['fresh_detail_attempts'] <= 20
          assert m['historical_detail_cache_expired'] == 0
          assert m['historical_detail_cache_carried_age'] >= 1
          assert m['detail_failed'] <= 4, m
          print('ISSUE_C_RELEASE_LIVE_OK', json.dumps({
              'detail_success':m['detail_success'], 'detail_failed':m['detail_failed'],
              'detail_status_counts':m['detail_status_counts'],
              'historical_prefill_used':m['historical_prefill_used'],
              'fresh_detail_attempts':m['fresh_detail_attempts'],
              'relay_recovery_candidates':m['relay_recovery_candidates'],
              'relay_recovery_success':m['relay_recovery_success'],
              'relay_recovery_failed':m['relay_recovery_failed'],
              'final_rescue_candidates':m['final_rescue_candidates'],
              'final_rescue_success':m['final_rescue_success'],
              'final_rescue_failed':m['final_rescue_failed'],
              'cache_carried_age':m['historical_detail_cache_carried_age'],
              'elapsed_seconds':d['source_runs']['madrid']['elapsed_seconds'],
          }, sort_keys=True))
          PY
      - name: Update production lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('jobbot/production.py')
          s=p.read_text(encoding='utf-8')
          old='PRODUCTION_VERSION = "V2.04_STATE_IDENTITY_COLLISION_REPAIR"'
          new='PRODUCTION_VERSION = "V2.05_MADRID_CACHE_FIRST_RELAY_RELIABILITY"'
          assert s.count(old) == 1
          p.write_text(s.replace(old,new),encoding='utf-8')
          v=Path('PRODUCTION_VERSION.json')
          data=json.loads(v.read_text(encoding='utf-8'))
          assert data['production_version'] == 'V2.04_STATE_IDENTITY_COLLISION_REPAIR'
          assert data['scoring_engine'] == 'V1.42_JUNIOR_RESEARCHER_TITLE_RECALL'
          data.update({
              'production_version':'V2.05_MADRID_CACHE_FIRST_RELAY_RELIABILITY',
              'scoring_engine':'V1.42_JUNIOR_RESEARCHER_TITLE_RECALL',
              'scope':'Issue C Madrid relay reliability/performance. Reuse strict recent Full JD cache before relay only for identical vacancy ID/title/company, keep CACHE labeling and two-day effective-age semantics, fresh-fetch all new/changed/no-cache vacancies, and allow one bounded third rescue attempt only for remaining transient no-cache relay failures. Madrid discovery coverage and scoring are unchanged; scoring remains frozen at V1.42.',
              'previous_production_version':'V2.04_STATE_IDENTITY_COLLISION_REPAIR',
          })
          v.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify scoring freeze and release lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jobbot.production as p
          assert p.PRODUCTION_VERSION == 'V2.05_MADRID_CACHE_FIRST_RELAY_RELIABILITY'
          assert p.FROZEN_ENGINE == 'V1.42_JUNIOR_RESEARCHER_TITLE_RECALL'
          result=p.verify_scoring_freeze(Path('.'))
          assert result['ok'] is True, result
          data=json.loads(Path('PRODUCTION_VERSION.json').read_text())
          assert data['production_version'] == p.PRODUCTION_VERSION
          assert data['scoring_engine'] == p.FROZEN_ENGINE
          print('ISSUE_C_LINEAGE_OK', p.PRODUCTION_VERSION, p.FROZEN_ENGINE)
          PY
      - name: Commit Issue C release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/madrid_idi_history.py tests/test_v202_madrid_cache_first_rescue.py jobbot/production.py PRODUCTION_VERSION.json
          git diff --cached --check
          git commit -m "Release V2.05 Madrid relay reliability"
          git push origin HEAD:main
