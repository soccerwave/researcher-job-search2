name: Source Diagnostic

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to benchmark without touching production state or R2
        required: true
        default: linkedin
        type: choice
        options:
          - linkedin
          - infojobs
          - academicpositions
          - ikerbasque
          - atswatch
          - santpau
          - fbg
          - biocat
          - gencat
          - csic
          - isciii
          - idibaps
          - upc
          - idibell
          - hospitaldelmar
          - euraxess
          - bist
          - institutions
          - madrid
          - fisabio
          - fps
          - iislafe

permissions:
  contents: read

concurrency:
  group: source-diagnostic-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      AI_JOB_SEARCH_MADS_REPO: ${{ github.workspace }}/external/ai-job-search
      AI_JOB_SEARCH_SPAIN_REPO: ${{ github.workspace }}/external/ai-job-search-spain
      MADS_REPO: ${{ vars.MADS_REPO }}
      INFOJOBS_REPO: ${{ vars.INFOJOBS_REPO }}
      EXTERNAL_REPO_TOKEN: ${{ secrets.EXTERNAL_REPO_TOKEN }}
      MADRID_RELAY_URL: ${{ vars.MADRID_RELAY_URL }}
      MADRID_RELAY_TOKEN: ${{ secrets.MADRID_RELAY_TOKEN }}

    steps:
      - name: Checkout production bot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Bun
        if: ${{ inputs.source == 'linkedin' || inputs.source == 'infojobs' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-cloud.txt

      - name: Clone selected external discovery transport
        if: ${{ inputs.source == 'linkedin' || inputs.source == 'infojobs' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          SOURCE="${{ inputs.source }}"

          clone_repo() {
            local repo="$1"
            local dest="$2"
            if [ -n "${EXTERNAL_REPO_TOKEN:-}" ]; then
              git clone --depth 1 "https://x-access-token:${EXTERNAL_REPO_TOKEN}@github.com/${repo}.git" "$dest"
            else
              git clone --depth 1 "https://github.com/${repo}.git" "$dest"
            fi
          }

          if [ "$SOURCE" = "linkedin" ]; then
            MADS_REPO="${MADS_REPO:-MadsLorentzen/ai-job-search}"
            clone_repo "$MADS_REPO" "$AI_JOB_SEARCH_MADS_REPO"
            if [ -f "$AI_JOB_SEARCH_MADS_REPO/package.json" ]; then
              (cd "$AI_JOB_SEARCH_MADS_REPO" && (bun install --frozen-lockfile || bun install))
            fi
          fi

          if [ "$SOURCE" = "infojobs" ]; then
            if [ -z "${INFOJOBS_REPO:-}" ]; then
              echo "Repository variable INFOJOBS_REPO is required for the InfoJobs diagnostic." >&2
              exit 2
            fi
            clone_repo "$INFOJOBS_REPO" "$AI_JOB_SEARCH_SPAIN_REPO"
            if [ -f "$AI_JOB_SEARCH_SPAIN_REPO/package.json" ]; then
              (cd "$AI_JOB_SEARCH_SPAIN_REPO" && (bun install --frozen-lockfile || bun install))
            fi
          fi

      - name: Verify Madrid relay
        if: ${{ inputs.source == 'madrid' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MADRID_RELAY_URL:-}"
          test -n "${MADRID_RELAY_TOKEN:-}"
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health" >/dev/null


      - name: Verify scoring freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          from jobbot.production import assert_scoring_freeze
          print(assert_scoring_freeze(Path('.').resolve()))
          PY

      - name: Benchmark selected source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/diagnostic
          SOURCE="${{ inputs.source }}"
          START=$(date +%s)
          echo "[diagnostic:start] source=$SOURCE utc=$(date -u +%FT%TZ)"

          python run_live_sample.py \
            --source "$SOURCE" \
            --no-state \
            --linkedin-repo "$AI_JOB_SEARCH_MADS_REPO" \
            --infojobs-repo "$AI_JOB_SEARCH_SPAIN_REPO" \
            --out runtime/diagnostic \
            | tee runtime/diagnostic_stdout.log

          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "[diagnostic:done] source=$SOURCE elapsed_seconds=$ELAPSED elapsed_minutes=$((ELAPSED / 60))"

      - name: Upload diagnostic artifact
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: source-diagnostic-${{ inputs.source }}-${{ github.run_id }}
          path: |
            runtime/diagnostic_stdout.log
            runtime/diagnostic/run_summary.json
            runtime/diagnostic/source_summary.csv
          retention-days: 14
          if-no-files-found: warn
