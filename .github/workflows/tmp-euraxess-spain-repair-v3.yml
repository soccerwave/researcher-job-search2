name: Temporary EURAXESS Spain repair v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'EURAXESS Spain resilient transport') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-cloud.txt
      - name: Build corrected candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/tmp-euraxess-spain-repair.yml').read_text(encoding='utf-8')
          def heredoc(marker, next_marker):
              s=wf.index(marker)+len(marker); e=wf.index(next_marker,s)
              return textwrap.dedent(wf[s:e]).lstrip('\n')
          patch_script=heredoc("cat > /tmp/patch_euraxess.py <<'PY'", "\n          PY\n\n          cat > sources/euraxess_transport.py")
          helper=heredoc("cat > sources/euraxess_transport.py <<'PY'", "\n          PY\n\n          python /tmp/patch_euraxess.py")
          tests=heredoc("cat > tests/test_v203_euraxess_resilient_transport.py <<'PY'", "\n          PY\n\n      - name: Focused regressions")

          helper=helper.replace("call = session.post if method.upper() == 'POST' else session.get", "call = getattr(session, 'post', session.get) if method.upper() == 'POST' else session.get")
          helper=helper.replace("_next_listing_url(response.text, response.url)", "_next_listing_url(response.text, getattr(response, 'url', current_url))")
          helper=helper.replace("_next_listing_url(retry.text, retry.url)", "_next_listing_url(retry.text, getattr(retry, 'url', current_url))")
          helper=helper.replace("_increment_page(response.url)", "_increment_page(getattr(response, 'url', current_url))")

          # Semantic selected-facet validation is authoritative. The local Spain ratio
          # remains diagnostic and filtering remains hard, but multi-location cards and
          # card-text quirks must not invalidate a semantically active server filter.
          helper=helper.replace("    if use_spain_facet and cards and ratio < 0.75:\n        facet_honored = False\n\n", "")

          # If a POST pagination hop unexpectedly returns an empty body, probe the same
          # advertised URL once with GET. The duplicate-content guard below decides
          # whether the GET is real progress or a reset/replay.
          needle="""                if not rows:\n                    stop_reason = 'empty_page'\n                    break\n\n                fp = _fingerprint(rows)\n"""
          repl="""                if not rows and not use_spain_facet and page > 0:\n                    probe = _request(\n                        session, 'GET', current_url, timeout=timeout, attempts=4,\n                        pace_seconds=max(request_delay, 2.5), backoff_base=15.0,\n                        backoff_cap=180.0, minimum_backoff=15.0,\n                    )\n                    probe.raise_for_status()\n                    probe_rows = parse_search_html(probe.text)\n                    if probe_rows:\n                        response = probe\n                        rows = probe_rows\n                        next_url = _next_listing_url(probe.text, getattr(probe, 'url', current_url))\n                if not rows:\n                    stop_reason = 'empty_page'\n                    break\n\n                fp = _fingerprint(rows)\n"""
          if needle not in helper:
              raise SystemExit('empty-page recovery anchor missing')
          helper=helper.replace(needle,repl,1)

          Path('/tmp/patch_euraxess.py').write_text(patch_script,encoding='utf-8')
          Path('sources/euraxess_transport.py').write_text(helper,encoding='utf-8')
          Path('tests/test_v203_euraxess_resilient_transport.py').write_text(tests,encoding='utf-8')

          old=Path('tests/test_v186_euraxess_recall_health.py')
          t=old.read_text(encoding='utf-8')
          needle_old='JOB Spain Example University Posted on: 20 September 2026 Work Locations: Spain</div>\n    """'
          repl_old='JOB Spain Example University Posted on: 20 September 2026 Work Locations: Spain</div>\n    <a rel="next" href="/jobs/search?page=1">Next</a>\n    """'
          if needle_old not in t: raise SystemExit('old regression anchor missing')
          old.write_text(t.replace(needle_old,repl_old,1),encoding='utf-8')
          PY
          python /tmp/patch_euraxess.py
      - name: Focused regressions and scoring freeze
        run: |
          python -m pytest -q tests/test_v186_euraxess_recall_health.py tests/test_v203_euraxess_resilient_transport.py
          python - <<'PY'
          from pathlib import Path
          from jobbot.production import assert_scoring_freeze
          print(assert_scoring_freeze(Path('.').resolve()))
          PY
      - name: Live listing validation
        run: |
          python - <<'PY'
          from sources import euraxess
          euraxess._FEED_CACHE.clear()
          cards, diag, _ = euraxess._get_spain_feed(pages=8, timeout=(10,45))
          print('LIVE_EURAXESS_CARDS=',len(cards))
          print('LIVE_EURAXESS_DIAG=',diag)
          assert len(cards) >= 10, diag
          assert diag.get('coverage_complete') is True, diag
          assert not diag.get('pagination_repeat_detected'), diag
          PY
      - name: Live bounded detail validation
        run: |
          python - <<'PY'
          from sources import euraxess
          euraxess._FEED_CACHE.clear()
          d={}
          rows=euraxess.collect(enrich_detail=True,pages=8,max_candidates=5,detail_request_delay=3.0,diagnostics=d)
          print('LIVE_DETAIL_ROWS=',len(rows))
          print('LIVE_DETAIL_DIAG=',d)
          assert rows, d
          assert d.get('detail_rate_limited') is False, d
          PY
      - name: Commit validated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/euraxess.py sources/euraxess_transport.py tests/test_v186_euraxess_recall_health.py tests/test_v203_euraxess_resilient_transport.py
          git diff --cached --stat
          git commit -m "EURAXESS Spain resilient transport" || exit 0
          git push origin main
