name: Issue C Final Madrid Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-c-final-release.yml"

permissions:
  contents: write

concurrency:
  group: production-job-search
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      MADRID_RELAY_URL: ${{ vars.MADRID_RELAY_URL }}
      MADRID_RELAY_TOKEN: ${{ secrets.MADRID_RELAY_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-cloud.txt

      - name: Apply final Issue C code patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sources/madrid_idi_history.py')
          s=p.read_text(encoding='utf-8')
          old='''def collect(*args, diagnostics: dict | None = None, **kwargs) -> list[dict]:\n    diag = diagnostics if diagnostics is not None else {}\n    rows = base.collect(*args, diagnostics=diag, **kwargs)\n    _apply_historical_fallback(rows, diag)\n    return rows\n'''
          new='''def _prefill_recent_history(rows: list[dict], diagnostics: dict) -> tuple[list[dict], list[dict]]:\n    \"\"\"Reuse strict recent Full JD cache before the fragile POEM relay.\n\n    Only the same stable vacancy identity with the same normalized title and company is\n    eligible, and the existing two-day effective-age policy still applies. Cache hits\n    remain explicitly CACHE, never masquerading as fresh network fetches.\n    \"\"\"\n    path = _download_latest_canonical()\n    cache, cache_diag = _load_cache(path)\n    diagnostics.update(cache_diag)\n    diagnostics[\"historical_prefill_attempted\"] = len(rows)\n    diagnostics[\"historical_prefill_used\"] = 0\n    diagnostics[\"historical_prefill_rejected\"] = 0\n    hits, misses = [], []\n    for row in rows:\n        previous = _match_current_to_history(row, cache) if cache else None\n        previous_detail = str((previous or {}).get(\"full_detail\") or \"\").strip()\n        if not previous or not previous_detail:\n            diagnostics[\"historical_prefill_rejected\"] += 1\n            misses.append(row)\n            continue\n        resolved_url = (\n            _clean(previous.get(\"detail_resolved_url\"))\n            or _clean(previous.get(\"trusted_full_detail_url\"))\n            or _clean(previous.get(\"url\"))\n        )\n        row[\"full_detail\"] = previous_detail\n        row[\"detail_status\"] = \"CACHE\"\n        row[\"detail_fetch_status\"] = \"CACHE_PREFILL\"\n        row[\"detail_source\"] = \"historical_prefill\"\n        row[\"detail_resolution_method\"] = \"historical_prefill\"\n        row[\"detail_age_days\"] = int(previous.get(\"_detail_age_days\") or 0)\n        row[\"trusted_full_detail_source\"] = \"Madrid I+D+i historical prefill\"\n        if resolved_url:\n            row[\"detail_resolved_url\"] = resolved_url\n            row[\"trusted_full_detail_url\"] = resolved_url\n        diagnostics[\"historical_prefill_used\"] += 1\n        hits.append(row)\n    return hits, misses\n\n\ndef _rescue_remaining_fresh_misses(rows: list[dict], diagnostics: dict) -> None:\n    \"\"\"One bounded third attempt only for transient no-cache relay failures.\"\"\"\n    import time\n    from concurrent.futures import ThreadPoolExecutor, as_completed\n\n    candidates = [row for row in rows if base._is_retryable_relay_failure(_clean(row.get(\"detail_status\")))]\n    diagnostics[\"final_rescue_candidates\"] = len(candidates)\n    diagnostics[\"final_rescue_attempts\"] = 0\n    diagnostics[\"final_rescue_workers\"] = 0\n    diagnostics[\"final_rescue_success\"] = 0\n    diagnostics[\"final_rescue_failed\"] = 0\n    if not candidates:\n        return\n    time.sleep(2.0)\n    diagnostics[\"final_rescue_attempts\"] = len(candidates)\n    workers = min(2, len(candidates))\n    diagnostics[\"final_rescue_workers\"] = workers\n    with ThreadPoolExecutor(max_workers=workers, thread_name_prefix=\"madrid-final-rescue\") as pool:\n        futures = {pool.submit(base._resolve_detail_row, i, row, (10, 45)): row for i, row in enumerate(candidates)}\n        for future in as_completed(futures):\n            row = futures[future]\n            old_status = _clean(row.get(\"detail_status\"))\n            try:\n                _, detail, status, resolved_url, method = future.result()\n            except Exception as exc:\n                detail, status, resolved_url, method = \"\", f\"DETAIL_WORKER_FAILED: {type(exc).__name__}: {exc}\", \"\", \"worker_failed\"\n            row[\"full_detail\"] = detail\n            row[\"detail_status\"] = status\n            row[\"detail_resolution_method\"] = method\n            row[\"final_rescue_attempted\"] = True\n            if resolved_url:\n                row[\"detail_resolved_url\"] = resolved_url\n            if detail and status in base._OK_DETAIL_STATUSES:\n                diagnostics[\"final_rescue_success\"] += 1\n                diagnostics[\"detail_failed\"] = max(0, int(diagnostics.get(\"detail_failed\", 0) or 0) - 1)\n                diagnostics[\"detail_success\"] = int(diagnostics.get(\"detail_success\", 0) or 0) + 1\n                if method == \"poem_api\":\n                    diagnostics[\"poem_api_success\"] = int(diagnostics.get(\"poem_api_success\", 0) or 0) + 1\n                    diagnostics[\"detail_resolved_via_poem_api\"] = int(diagnostics.get(\"detail_resolved_via_poem_api\", 0) or 0) + 1\n                    diagnostics[\"detail_resolved_via_poem\"] = int(diagnostics.get(\"detail_resolved_via_poem\", 0) or 0) + 1\n                elif method == \"external_from_poem_api\":\n                    diagnostics[\"detail_resolved_via_external_api_link\"] = int(diagnostics.get(\"detail_resolved_via_external_api_link\", 0) or 0) + 1\n                    diagnostics[\"detail_resolved_via_external\"] = int(diagnostics.get(\"detail_resolved_via_external\", 0) or 0) + 1\n                counts = dict(diagnostics.get(\"detail_status_counts\") or {})\n                if old_status in counts:\n                    counts[old_status] = max(0, int(counts.get(old_status, 0) or 0) - 1)\n                    if counts[old_status] == 0:\n                        counts.pop(old_status, None)\n                counts[status] = int(counts.get(status, 0) or 0) + 1\n                diagnostics[\"detail_status_counts\"] = counts\n            else:\n                diagnostics[\"final_rescue_failed\"] += 1\n\n\ndef collect(*args, diagnostics: dict | None = None, **kwargs) -> list[dict]:\n    diag = diagnostics if diagnostics is not None else {}\n    enrich_detail = bool(kwargs.pop(\"enrich_detail\", True))\n    if not enrich_detail:\n        return base.collect(*args, diagnostics=diag, enrich_detail=False, **kwargs)\n\n    rows = base.collect(*args, diagnostics=diag, enrich_detail=False, **kwargs)\n    hits, misses = _prefill_recent_history(rows, diag)\n    cache_count = len(hits)\n    diag[\"detail_success\"] = 0\n    diag[\"detail_failed\"] = 0\n    diag[\"detail_attempts\"] = 0\n    diag[\"detail_status_counts\"] = {}\n    diag[\"fresh_detail_attempts\"] = len(misses)\n\n    if misses:\n        workers = int(kwargs.get(\"detail_workers\", 1) or 1)\n        base._enrich_detail_rows(misses, diag, timeout=(10, 45), detail_workers=workers)\n        _rescue_remaining_fresh_misses(misses, diag)\n\n    counts = dict(diag.get(\"detail_status_counts\") or {})\n    if cache_count:\n        counts[\"CACHE\"] = int(counts.get(\"CACHE\", 0) or 0) + cache_count\n    diag[\"detail_status_counts\"] = counts\n    diag[\"detail_success\"] = int(diag.get(\"detail_success\", 0) or 0) + cache_count\n    diag[\"fresh_detail_failed\"] = int(diag.get(\"detail_failed\", 0) or 0)\n\n    _apply_historical_fallback(rows, diag)\n    return rows\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old,new), encoding='utf-8')

          relay=Path('cloudflare-madrid-relay/src/index.js')
          rs=relay.read_text(encoding='utf-8')
          assert rs.count('const UPSTREAM_TIMEOUT_MS = 6000;') == 1
          relay.write_text(rs.replace('const UPSTREAM_TIMEOUT_MS = 6000;', 'const UPSTREAM_TIMEOUT_MS = 12000;'), encoding='utf-8')
          PY

      - name: Add Issue C regressions
        run: |
          cat > tests/test_v202_madrid_cache_first_rescue.py <<'PY'
          import csv
          import gzip
          import time
          from pathlib import Path
          from sources import madrid_idi_history as history

          def _write(path: Path, rows: list[dict]):
              fields=["source","id","title","company","url","full_detail","detail_status","detail_age_days","availability_as_of","last_seen","detail_resolved_url","trusted_full_detail_url"]
              with gzip.open(path,"wt",encoding="utf-8-sig",newline="") as f:
                  w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          def _row(job_id="A1", title="Researcher", company="Institute"):
              return {"source":"Madrid I+D+i","id":job_id,"title":title,"company":company,"url":f"https://example.test/{job_id}"}

          def test_prefill_exact_recent_match_only(tmp_path, monkeypatch):
              p=tmp_path/"h.csv.gz"
              _write(p,[{"source":"Madrid I+D+i","id":"A1","title":"Researcher","company":"Institute","url":"https://example.test/A1","full_detail":"trusted detail","detail_status":"OK","detail_age_days":"0","availability_as_of":"2026-10-04","last_seen":"2026-10-04","detail_resolved_url":"https://example.test/A1","trusted_full_detail_url":"https://example.test/A1"}])
              monkeypatch.setenv("MADRID_HISTORY_CANONICAL_PATH",str(p))
              hit=_row(); changed=_row(title="Senior Researcher"); diag={}
              hits,misses=history._prefill_recent_history([hit,changed],diag)
              assert hits==[hit] and misses==[changed]
              assert hit["detail_status"]=="CACHE" and hit["detail_fetch_status"]=="CACHE_PREFILL"
              assert diag["historical_prefill_used"]==1 and diag["historical_prefill_rejected"]==1

          def test_prefill_respects_effective_age(tmp_path, monkeypatch):
              p=tmp_path/"h.csv.gz"
              _write(p,[{"source":"Madrid I+D+i","id":"A1","title":"Researcher","company":"Institute","url":"https://example.test/A1","full_detail":"old detail","detail_status":"CACHE","detail_age_days":"2","availability_as_of":"2026-10-03","last_seen":"2026-10-03","detail_resolved_url":"https://example.test/A1","trusted_full_detail_url":"https://example.test/A1"}])
              monkeypatch.setenv("MADRID_HISTORY_CANONICAL_PATH",str(p))
              import datetime
              monkeypatch.setattr(history,"date",type("FixedDate",(),{"today":staticmethod(lambda:datetime.date(2026,10,4))}))
              row=_row(); diag={}; hits,misses=history._prefill_recent_history([row],diag)
              assert hits==[] and misses==[row]
              assert diag["historical_detail_cache_expired"]==1

          def test_final_rescue_only_transient_misses(monkeypatch):
              rows=[{**_row("A1"),"detail_status":"POEM_RELAY_HTTP_504"},{**_row("A2"),"detail_status":"OK","full_detail":"good"},{**_row("A3"),"detail_status":"POEM_RELAY_HTTP_503"}]
              calls=[]
              monkeypatch.setattr(time,"sleep",lambda *_:None)
              monkeypatch.setattr(history.base,"_resolve_detail_row",lambda i,row,timeout:(calls.append(row["id"]) or (i,"fresh detail","OK",row["url"],"poem_api")))
              diag={"detail_failed":2,"detail_success":1,"detail_status_counts":{"POEM_RELAY_HTTP_504":1,"POEM_RELAY_HTTP_503":1,"OK":1},"poem_api_success":0,"detail_resolved_via_poem_api":0,"detail_resolved_via_poem":0}
              history._rescue_remaining_fresh_misses(rows,diag)
              assert sorted(calls)==["A1","A3"]
              assert diag["final_rescue_attempts"]==2 and diag["final_rescue_success"]==2
              assert diag["detail_failed"]==0 and diag["detail_success"]==3
          PY

      - name: Run focused regressions
        env:
          MADRID_RELAY_URL: ""
          MADRID_RELAY_TOKEN: ""
        run: |
          pytest -q \
            tests/test_v172_madrid_relay_backpressure.py \
            tests/test_v173_madrid_deferred_relay_recovery.py \
            tests/test_v201_madrid_cache_age.py \
            tests/test_v202_madrid_cache_first_rescue.py \
            -k "not manifest"

      - name: Deploy 12-second relay candidate
        working-directory: cloudflare-madrid-relay
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@latest deploy
          sleep 3
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health"

      - name: Live validation of combined fix
        run: |
          mkdir -p runtime/c
          START=$(date +%s)
          python run_live_sample.py --source madrid --no-state --out runtime/c | tee runtime/c/stdout.log
          END=$(date +%s)
          echo "ISSUE_C_FINAL_ELAPSED_SECONDS=$((END-START))"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runtime/c/run_summary.json').read_text())
          m=d['source_diagnostics']['madrid']
          assert m['coverage_complete'] is True
          assert m['pages_fetched']==10 and m['parsed_cards']==100 and m['unique_cards']==100
          assert not m['card_count_mismatches']
          assert m['detail_success'] + m['detail_failed'] == 100
          assert m['historical_prefill_used'] >= 80
          assert m['fresh_detail_attempts'] <= 20
          assert m['historical_detail_cache_expired'] == 0
          assert m['historical_detail_cache_carried_age'] >= 1
          assert m['detail_failed'] <= 1, m
          assert d['source_runs']['madrid']['elapsed_seconds'] <= 180, d['source_runs']['madrid']
          print('ISSUE_C_FINAL_LIVE_OK',json.dumps({
              'detail_success':m['detail_success'],'detail_failed':m['detail_failed'],
              'historical_prefill_used':m['historical_prefill_used'],
              'fresh_detail_attempts':m['fresh_detail_attempts'],
              'relay_recovery_candidates':m.get('relay_recovery_candidates'),
              'relay_recovery_success':m.get('relay_recovery_success'),
              'relay_recovery_failed':m.get('relay_recovery_failed'),
              'final_rescue_candidates':m.get('final_rescue_candidates'),
              'final_rescue_success':m.get('final_rescue_success'),
              'final_rescue_failed':m.get('final_rescue_failed'),
              'elapsed_seconds':d['source_runs']['madrid']['elapsed_seconds']
          },sort_keys=True))
          PY

      - name: Update V2.05 lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('jobbot/production.py'); s=p.read_text(encoding='utf-8')
          old='PRODUCTION_VERSION = "V2.04_STATE_IDENTITY_COLLISION_REPAIR"'
          new='PRODUCTION_VERSION = "V2.05_MADRID_RELAY_RELIABILITY"'
          assert s.count(old)==1
          p.write_text(s.replace(old,new),encoding='utf-8')
          v=Path('PRODUCTION_VERSION.json'); data=json.loads(v.read_text(encoding='utf-8'))
          assert data['production_version']=='V2.04_STATE_IDENTITY_COLLISION_REPAIR'
          assert data['scoring_engine']=='V1.42_JUNIOR_RESEARCHER_TITLE_RECALL'
          data.update({
            'production_version':'V2.05_MADRID_RELAY_RELIABILITY',
            'scoring_engine':'V1.42_JUNIOR_RESEARCHER_TITLE_RECALL',
            'scope':'Issue C Madrid relay reliability/performance. Cloudflare upstream timeout increased from 6s to 12s; strict recent cache prefill is used only for identical vacancy ID/title/company under the unchanged two-day effective-age policy; new/changed/no-cache vacancies are fresh-fetched; one bounded third rescue attempt is allowed only for remaining transient no-cache failures. Madrid discovery and scoring are unchanged; scoring remains frozen at V1.42.',
            'previous_production_version':'V2.04_STATE_IDENTITY_COLLISION_REPAIR'
          })
          v.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Verify scoring freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jobbot.production as p
          assert p.PRODUCTION_VERSION=='V2.05_MADRID_RELAY_RELIABILITY'
          assert p.FROZEN_ENGINE=='V1.42_JUNIOR_RESEARCHER_TITLE_RECALL'
          result=p.verify_scoring_freeze(Path('.'))
          assert result['ok'] is True, result
          data=json.loads(Path('PRODUCTION_VERSION.json').read_text())
          assert data['production_version']==p.PRODUCTION_VERSION
          assert data['scoring_engine']==p.FROZEN_ENGINE
          print('ISSUE_C_FREEZE_OK',result)
          PY

      - name: Commit final Issue C release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/madrid_idi_history.py tests/test_v202_madrid_cache_first_rescue.py cloudflare-madrid-relay/src/index.js jobbot/production.py PRODUCTION_VERSION.json
          git diff --cached --check
          git commit -m "Release V2.05 Madrid relay reliability"
          git push origin HEAD:main

      - name: Verify final relay health
        run: |
          grep -q 'const UPSTREAM_TIMEOUT_MS = 12000;' cloudflare-madrid-relay/src/index.js
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health"
          echo "ISSUE_C_FINAL_RELAY_OK=1"

      - name: Roll back relay on failed release
        if: failure()
        working-directory: cloudflare-madrid-relay
        run: |
          git checkout HEAD -- src/index.js || true
          if grep -q 'const UPSTREAM_TIMEOUT_MS = 6000;' src/index.js; then
            npx --yes wrangler@latest deploy
            sleep 3
            curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health"
            echo "ISSUE_C_RELAY_ROLLBACK_TO_6S_OK=1"
          else
            echo "Rollback skipped because committed HEAD no longer contains 6s relay."
          fi
