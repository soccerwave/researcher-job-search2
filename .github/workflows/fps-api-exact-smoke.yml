name: FPS API Exact Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fps-api-exact-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Query exact FPS API slug
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json
          url='https://datos.juntadeandalucia.es/api/v0/job-offering-public-sector/search'
          params={
            'announcement_status':'En curso',
            'job_official_degree_requirements':'-',
            'announcement_type':'-',
            'provinces':'-',
            'job_agreement':'-',
            'order_by':'id',
            'mode':'DESC',
            'format':'json',
            'size':100,
            'organism':'saludyfamilias_adscritos_fps2'
          }
          r=requests.get(url,params=params,timeout=(10,30))
          print('STATUS=',r.status_code)
          print('URL=',r.url)
          print('BODY_HEAD=',r.text[:500])
          r.raise_for_status()
          x=r.json()
          rows=x.get('results',[])
          print('HITS=',x.get('hits'))
          print('TOTAL_HITS=',x.get('total_hits'))
          print('ROWS=',len(rows))
          print('IDS=',[q.get('id') for q in rows])
          print('TITLES=',[q.get('job_name') for q in rows])
          print('DEADLINES=',[q.get('deadline_application') for q in rows])
          assert rows
          assert all(any(o.get('organism')=='saludyfamilias_adscritos_fps2' for o in q.get('organisms',[])) for q in rows)
          PY
