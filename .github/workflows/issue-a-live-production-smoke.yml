name: Issue A live production-path smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-a-live-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-a-live-production-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      JOBBOT_STATE_FILE: ${{ github.workspace }}/runtime/state/validation_seen_jobs.json
      AI_JOB_SEARCH_MADS_REPO: ${{ github.workspace }}/external/ai-job-search
      AI_JOB_SEARCH_SPAIN_REPO: ${{ github.workspace }}/external/ai-job-search-spain
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      MADS_REPO: ${{ vars.MADS_REPO }}
      INFOJOBS_REPO: ${{ vars.INFOJOBS_REPO }}
      EXTERNAL_REPO_TOKEN: ${{ secrets.EXTERNAL_REPO_TOKEN }}
      MADRID_RELAY_URL: ${{ vars.MADRID_RELAY_URL }}
      MADRID_RELAY_TOKEN: ${{ secrets.MADRID_RELAY_TOKEN }}

    steps:
      - name: Checkout production bot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-cloud.txt

      - name: Clone external discovery transports exactly as production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          MADS_REPO="${MADS_REPO:-MadsLorentzen/ai-job-search}"
          if [ -z "${INFOJOBS_REPO:-}" ]; then
            echo "Repository variable INFOJOBS_REPO is required." >&2
            exit 2
          fi
          clone_repo() {
            local repo="$1"
            local dest="$2"
            if [ -n "${EXTERNAL_REPO_TOKEN:-}" ]; then
              git clone --depth 1 "https://x-access-token:${EXTERNAL_REPO_TOKEN}@github.com/${repo}.git" "$dest"
            else
              git clone --depth 1 "https://github.com/${repo}.git" "$dest"
            fi
          }
          clone_repo "$MADS_REPO" "$AI_JOB_SEARCH_MADS_REPO"
          clone_repo "$INFOJOBS_REPO" "$AI_JOB_SEARCH_SPAIN_REPO"
          for repo in "$AI_JOB_SEARCH_MADS_REPO" "$AI_JOB_SEARCH_SPAIN_REPO"; do
            if [ -f "$repo/package.json" ]; then
              (cd "$repo" && (bun install --frozen-lockfile || bun install))
            fi
          done

      - name: Restore validated production state to disposable local copy
        run: |
          mkdir -p runtime/state runtime/issue_a_live_output
          python scripts/r2_store.py download-state --dest "$JOBBOT_STATE_FILE"
          cp "$JOBBOT_STATE_FILE" /tmp/validation_state_before.json
          sha256sum "$JOBBOT_STATE_FILE" | tee /tmp/state_before.sha256

      - name: Verify Madrid relay and scoring freeze
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MADRID_RELAY_URL:-}" ] || [ -z "${MADRID_RELAY_TOKEN:-}" ]; then
            echo "MADRID relay configuration missing" >&2
            exit 2
          fi
          curl -fsS --max-time 10 "${MADRID_RELAY_URL%/}/health" >/dev/null
          python - <<'PY'
          from pathlib import Path
          from jobbot.production import assert_scoring_freeze, FROZEN_ENGINE, PRODUCTION_VERSION
          result = assert_scoring_freeze(Path('.').resolve())
          print(result)
          print({'production_version': PRODUCTION_VERSION, 'scoring_engine': FROZEN_ENGINE})
          assert result['ok'] and result['mismatches'] == []
          assert FROZEN_ENGINE == 'V1.42_JUNIOR_RESEARCHER_TITLE_RECALL'
          assert PRODUCTION_VERSION == 'V2.03_JUNIOR_RESEARCHER_TITLE_RECALL'
          PY

      - name: Run all configured production sources without publish or notifications
        run: |
          python run_live_sample.py \
            --source all \
            --state-file "$JOBBOT_STATE_FILE" \
            --linkedin-repo "$AI_JOB_SEARCH_MADS_REPO" \
            --infojobs-repo "$AI_JOB_SEARCH_SPAIN_REPO" \
            --out runtime/issue_a_live_output \
            | tee runtime/issue_a_live_stdout.json

      - name: Audit live evaluator behavior and source health
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path

          out = Path('runtime/issue_a_live_output')
          summary = json.loads((out / 'run_summary.json').read_text(encoding='utf-8'))
          assert summary['production_version'] == 'V2.03_JUNIOR_RESEARCHER_TITLE_RECALL'
          assert summary['scoring_engine'] == 'V1.42_JUNIOR_RESEARCHER_TITLE_RECALL'
          assert summary['scoring_freeze_check']['ok'] is True
          assert summary['scoring_freeze_check']['mismatches'] == []
          assert summary['evaluated'] > 0

          with (out / 'all_canonical.csv').open(encoding='utf-8-sig', newline='') as f:
            rows = list(csv.DictReader(f))

          print('LIVE_SUMMARY', json.dumps({
              'raw': summary['raw'],
              'unique': summary['unique'],
              'evaluated': summary['evaluated'],
              'needs_detail_review': summary['needs_detail_review'],
              'recommendations': summary['recommendations'],
              'configured_scan_complete': summary['configured_scan_complete'],
              'errors': summary['errors'],
              'warnings': summary['warnings'],
              'state_jobs': summary['seen_state_jobs'],
          }, ensure_ascii=False))

          source_status = {k: v.get('status') for k, v in summary['source_runs'].items()}
          print('SOURCE_STATUS_COUNTS', dict(Counter(source_status.values())))
          print('NON_OK_SOURCES', json.dumps({k: v for k, v in source_status.items() if v != 'OK'}, ensure_ascii=False))

          checks = {
              'evonik': lambda r: 'evonik' in ((r.get('company') or '') + ' ' + (r.get('title') or '')).lower(),
              'iglubit': lambda r: 'iglubit' in ((r.get('company') or '') + ' ' + (r.get('title') or '')).lower(),
              'upm_junior_researcher': lambda r: (r.get('title') or '').strip().lower() == 'project manager / junior researcher',
              'fps_research_funding': lambda r: 'captación y gestión de fondos' in (r.get('title') or '').lower(),
          }
          for name, pred in checks.items():
            hits = [r for r in rows if pred(r)]
            print('LIVE_TARGET', name, json.dumps([
                {k: r.get(k) for k in ('title','company','score','recommendation','job_family','domain_category','detail_status','source')}
                for r in hits
            ], ensure_ascii=False))
            for r in hits:
              score = int(r['score']) if str(r.get('score') or '').strip() else None
              if name in {'evonik','iglubit'}:
                assert r['recommendation'] == 'SKIP' and score is not None and score < 50
                assert r['job_family'] != 'research_project_management'
              elif name == 'upm_junior_researcher':
                assert r['job_family'] == 'research_academic'
                assert r['recommendation'] != 'SKIP' and score is not None and score >= 50
              elif name == 'fps_research_funding':
                assert r['job_family'] == 'research_project_management'
                assert score is not None and score >= 65

          # This smoke intentionally mutates only the disposable local state copy.
          # R2 is never published by this workflow.
          assert Path('/tmp/validation_state_before.json').exists()
          print('LOCAL_STATE_AFTER_SHA256')
          import hashlib
          p = Path('runtime/state/validation_seen_jobs.json')
          print(hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Re-run Issue A evaluator regression pack on live checkout
        run: |
          pytest -q \
            tests/test_scoring_v142_junior_researcher_recall.py \
            tests/test_scoring_v141_project_pm_precision.py \
            tests/test_v140_research_pm_recall.py \
            tests/test_v188_evaluator_calibration.py

      - name: Record that no production publication occurred
        run: |
          echo "Smoke completed without build_cloud_report, publish-run, upload-artifact, or Telegram notification steps."
          echo "R2 production state was read only; only JOBBOT_STATE_FILE local copy was mutated."
