name: FPS Open Data Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fps-open-data-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Junta open data API
        shell: bash
        run: |
          set -euo pipefail
          API='https://datos.juntadeandalucia.es/api/v0/job-offering-public-sector'
          echo '=== OpenAPI ==='
          curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/openapi.json -w 'HTTP=%{http_code} CONNECT=%{time_connect} TOTAL=%{time_total} IP=%{remote_ip}\n' "$API/openapi.json"
          echo "OPENAPI_BYTES=$(wc -c </tmp/openapi.json)"
          echo '=== options organization ==='
          curl -L -sS --connect-timeout 10 --max-time 30 "$API/option-values/organization" -o /tmp/org.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/org.json'))
          print(type(x).__name__)
          print(json.dumps(x,ensure_ascii=False)[:5000])
          PY
          echo '=== search FPS candidates ==='
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://datos.juntadeandalucia.es/api/v0/job-offering-public-sector/search'
          org=json.load(open('/tmp/org.json'))
          vals=[]
          if isinstance(org,dict):
              for k,v in org.items():
                  if isinstance(v,list): vals += v
          elif isinstance(org,list):
              vals=org
          print('ORG_VALUES_SAMPLE=', vals[:20])
          # print FPS-like values only
          print('FPS_VALUES=', [v for v in vals if 'progreso' in str(v).lower() or 'fps' in str(v).lower()])
          PY

      - name: Query current FPS records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json
          url='https://datos.juntadeandalucia.es/api/v0/job-offering-public-sector/search'
          params={
            'announcement_status':'En curso',
            'job_official_degree_requirements':'-',
            'announcement_type':'-',
            'provinces':'-',
            'job_agreement':'-',
            'order_by':'id',
            'mode':'DESC',
            'format':'json',
            'size':100,
            'organism':'Fundación Pública Andaluza Progreso y Salud',
            'job_name':'-',
            'job_specific_degree_requirements':'-',
            'locality':'-'
          }
          r=requests.get(url,params=params,timeout=(10,30))
          print('STATUS=',r.status_code)
          print('URL=',r.url)
          print('BYTES=',len(r.content))
          print('BODY=',r.text[:1000])
          if r.status_code < 400:
              x=r.json()
          else:
              x={}
          print('TYPE=',type(x).__name__)
          print('TOP_KEYS=',list(x) if isinstance(x,dict) else None)
          print('JSON_SAMPLE=',json.dumps(x,ensure_ascii=False)[:12000])
          PY

      - name: Download full official dataset
        shell: bash
        run: |
          set -euo pipefail
          URL='https://datos.juntadeandalucia.es/api/v0/job-offering-public-sector/all?format=json'
          curl -L -sS --connect-timeout 10 --max-time 60 -o /tmp/all.json -w 'HTTP=%{http_code} TOTAL=%{time_total} BYTES=%{size_download} FINAL=%{url_effective}\n' "$URL"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/all.json'))
          print('TYPE=',type(x).__name__)
          print('TOP_KEYS=',list(x)[:20] if isinstance(x,dict) else None)
          rows=x.get('result',x) if isinstance(x,dict) else x
          print('ROWS=',len(rows) if isinstance(rows,list) else 'NA')
          if isinstance(rows,list):
              fps=[r for r in rows if 'progreso y salud' in str(r.get('organism','')).lower()]
              print('FPS_ROWS=',len(fps))
              print('FPS_SAMPLE=',json.dumps(fps[-3:] if fps else [],ensure_ascii=False)[:10000])
          PY

      - name: Query open records without organism slug
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json
          url='https://datos.juntadeandalucia.es/api/v0/job-offering-public-sector/search'
          params={
            'announcement_status':'En curso',
            'job_official_degree_requirements':'-',
            'announcement_type':'-',
            'provinces':'-',
            'job_agreement':'-',
            'order_by':'id',
            'mode':'DESC',
            'format':'json',
            'size':200
          }
          r=requests.get(url,params=params,timeout=(10,30))
          print('STATUS2=',r.status_code)
          print('URL2=',r.url)
          print('BODY2=',r.text[:12000])
          if r.ok:
              x=r.json()
              rows=x.get('result',x) if isinstance(x,dict) else x
              if isinstance(rows,list):
                  fps=[q for q in rows if 'progreso y salud' in json.dumps(q,ensure_ascii=False).lower()]
                  print('ROWS2=',len(rows))
                  print('FPS_ROWS2=',len(fps))
                  print('FPS2=',json.dumps(fps[:20],ensure_ascii=False)[:20000])
          PY
